  { id:"u1l3", title:"Robots a tu alrededor", steps:[
    {t:"learn", h:"Están en todas partes", p:`<ul><li><strong>Fábricas:</strong> brazos que sueldan y pintan autos.</li><li><strong>Hogar:</strong> aspiradoras y cortadoras de pasto.</li><li><strong>Medicina:</strong> robots que ayudan a los cirujanos a ser más precisos.</li><li><strong>Espacio:</strong> vehículos que exploran Marte.</li><li><strong>Campo:</strong> drones que revisan cultivos.</li></ul>`},
    {t:"learn", h:"Autónomo o teledirigido", p:`<p>Un robot <span class="key">autónomo</span> decide solo según lo que detecta. Uno <span class="key">teledirigido</span> lo maneja una persona a distancia, como un auto a control remoto.</p>`},
    {t:"mc", q:"¿Cómo se llama el vehículo robot que explora Marte?", o:["Rover","Dron","Satélite","Cohete"], a:0, ex:"Los rovers son robots con ruedas que recorren la superficie de otro planeta."},
    {t:"tf", q:"Un robot siempre necesita una persona que lo controle.", a:false, ex:"Los robots autónomos toman sus propias decisiones con la información de sus sensores."},
    {t:"mc", q:"¿Qué significa que un robot sea autónomo?", o:["Que decide solo según lo que detecta","Que es muy rápido","Que funciona con pilas","Que tiene forma humana"], a:0, ex:"Autónomo = funciona por su cuenta."}
  ]}
]},
{ id:"u2", color:"b", title:"Electricidad sin miedo", desc:"Voltaje, corriente y tu primer LED.",
  lessons:[
  { id:"u2l1", title:"Voltaje, corriente y resistencia", steps:[
    {t:"learn", h:"Piénsalo como agua", p:`<p>La electricidad se parece al agua en una manguera:</p><ul><li><strong>Voltaje</strong> = la presión que empuja el agua. Se mide en <span class="key">voltios (V)</span>.</li><li><strong>Corriente</strong> = cuánta agua pasa. Se mide en <span class="key">amperios (A)</span>.</li><li><strong>Resistencia</strong> = lo que frena el paso, como apretar la manguera. Se mide en <span class="key">ohmios (Ω)</span>.</li></ul>`, tip:"Un Arduino trabaja con 5 V. Una pila común tiene 1,5 V."},
    {t:"match", q:"Une cada magnitud con su unidad", pairs:[["Voltaje","Voltios (V)"],["Corriente","Amperios (A)"],["Resistencia","Ohmios (Ω)"]]},
    {t:"mc", q:"En el ejemplo del agua, ¿qué sería la resistencia?", o:["Apretar la manguera","El agua que sale","La canilla abierta","El balde"], a:0, ex:"La resistencia frena el paso de la corriente, como apretar la manguera frena el agua."},
    {t:"fill", q:"La ___ es la cantidad de electricidad que circula.", o:["corriente","resistencia","batería","presión"], a:0, ex:"La corriente es el flujo; el voltaje es lo que la empuja."},
    {t:"input", q:"¿Con cuántos voltios trabaja un Arduino UNO?", a:["5"], unit:"V", ex:"Arduino UNO trabaja con 5 voltios."}
  ]},
  { id:"u2l2", title:"El circuito cerrado", steps:[
    {t:"learn", h:"Un camino de ida y vuelta", p:`<p>La electricidad solo circula si tiene un <strong>camino completo</strong>: sale del <span class="key">+</span> de la batería, pasa por el componente y vuelve al <span class="key">−</span>.</p><p>En Arduino, el negativo se llama <span class="key">GND</span> (tierra). Si el camino se corta en cualquier punto, todo se apaga. Eso hace un interruptor: abre o cierra el camino.</p>`},
    {t:"tf", q:"Si el circuito está abierto (cortado), el LED se enciende.", a:false, ex:"Con el camino cortado no circula corriente, así que el LED queda apagado."},
    {t:"mc", q:"¿Qué es GND?", o:["El negativo o tierra, donde vuelve la corriente","Un tipo de sensor","El botón de encendido","Un cable especial de 12 V"], a:0, ex:"GND es la referencia de 0 V. Todo circuito necesita volver a GND."},
    {t:"order", q:"Ordena cómo conectar un LED", items:["Conecta el + a la resistencia","Conecta la resistencia a la pata larga del LED","Conecta la pata corta del LED a GND"], ex:"Así se forma el camino completo: + → resistencia → LED → GND."}
  ]},
  { id:"u2l3", title:"El LED y su resistencia", steps:[
    {t:"learn", h:"El LED tiene un lado correcto", p:`<p>Un <strong>LED</strong> es una luz pequeña que solo funciona conectada en un sentido.</p>`, fig:"led"},
    {t:"learn", h:"Siempre con resistencia", p:`<p>Si conectas un LED directo a 5 V, pasa demasiada corriente y se quema. Por eso se pone una <strong>resistencia</strong> (por ejemplo de 220 Ω) que limita la corriente.</p><p>La regla que une todo es la <span class="key">Ley de Ohm</span>: <strong>V = I × R</strong>. Despejando: <strong>I = V ÷ R</strong>.</p>`, tip:"<b>Ejemplo:</b> 5 V ÷ 250 Ω = 0,02 A, que son 20 miliamperios (mA). Un LED común trabaja bien con unos 20 mA."},
    {t:"mc", q:"¿Para qué se pone una resistencia junto al LED?", o:["Para limitar la corriente y que no se queme","Para que brille de otro color","Para que gire","Para guardar energía"], a:0, ex:"La resistencia frena la corriente a un valor seguro."},
    {t:"mc", q:"La pata más larga del LED es…", o:["El positivo (ánodo)","El negativo (cátodo)","Da igual","La tierra"], a:0, ex:"Pata larga = positivo. Si lo conectas al revés, simplemente no enciende."},
    {t:"mc", q:"Con 5 V y una resistencia de 250 Ω, ¿cuánta corriente circula?", o:["0,02 A (20 mA)","2 A","50 A","0,5 A"], a:0, ex:"I = V ÷ R = 5 ÷ 250 = 0,02 A."}
  ]}
]},
{ id:"u3", color:"v", title:"Arduino, el cerebro", desc:"Pines, programas y tu primer código.",
  lessons:[
  { id:"u3l1", title:"¿Qué es un microcontrolador?", steps:[
    {t:"learn", h:"Una computadora en un chip", p:`<p>Un <strong>microcontrolador</strong> es una computadora diminuta metida en un solo chip. Ejecuta un único programa, una y otra vez, mientras tenga energía.</p><p><strong>Arduino UNO</strong> es una placa que trae un microcontrolador llamado <span class="key">ATmega328P</span>, pines para conectar cosas y un puerto USB.</p>`},
    {t:"mc", q:"¿Qué chip lleva el Arduino UNO?", o:["ATmega328P","Intel Core i5","Raspberry Pi","ESP32"], a:0, ex:"El ATmega328P es el cerebro del Arduino UNO."},
    {t:"tf", q:"Una vez cargado el programa, Arduino lo sigue ejecutando aunque lo desconectes de la computadora, si tiene batería.", a:true, ex:"El programa queda guardado en el chip. La computadora solo hace falta para cargarlo."},
    {t:"mc", q:"¿Cómo se carga un programa en Arduino?", o:["Con un cable USB desde Arduino IDE","Por bluetooth automáticamente","Con un pendrive","Se escribe en la placa con lápiz"], a:0, ex:"Escribes el código en Arduino IDE en tu computadora y lo subes por USB."}
  ]},
  { id:"u3l2", title:"Pines digitales y analógicos", steps:[
    {t:"learn", h:"Las patitas de la placa", p:`<ul><li><strong>Pines digitales (0 a 13):</strong> solo dos estados, <span class="key">HIGH</span> (5 V, encendido) o <span class="key">LOW</span> (0 V, apagado). Como un interruptor.</li><li><strong>Pines analógicos (A0 a A5):</strong> leen valores intermedios, de <span class="key">0 a 1023</span>. Sirven para sensores de luz o perillas.</li><li><strong>Pines con ~ (PWM):</strong> encienden y apagan muy rápido para simular valores intermedios. Así se regula el brillo de un LED.</li></ul>`},
    {t:"match", q:"Une cada término con su significado", pairs:[["HIGH","Encendido (5 V)"],["LOW","Apagado (0 V)"],["A0","Entrada analógica"],["~9","Salida PWM"]]},
    {t:"mc", q:"analogRead(A0) devuelve un número entre…", o:["0 y 1023","0 y 1","0 y 100","−5 y 5"], a:0, ex:"La lectura analógica tiene 1024 niveles: de 0 a 1023."},
    {t:"fill", q:"Para regular el brillo de un LED usamos ___.", o:["PWM","GND","USB","HIGH"], a:0, ex:"PWM simula voltajes intermedios encendiendo y apagando muy rápido."}
  ]},
  { id:"u3l3", title:"Tu primer programa: Blink", steps:[
    {t:"learn", h:"setup() y loop()", p:`<p>Todo programa de Arduino tiene dos partes:</p><ul><li><strong>setup()</strong> se ejecuta <span class="key">una sola vez</span> al encender.</li><li><strong>loop()</strong> se repite <span class="key">para siempre</span>.</li></ul><p>Este programa hace parpadear el LED que ya viene en la placa (pin 13):</p>`, code:`void setup() {\n  pinMode(13, OUTPUT);   // el pin 13 será una salida\n}\n\nvoid loop() {\n  digitalWrite(13, HIGH); // enciende\n  delay(1000);            // espera 1 segundo\n  digitalWrite(13, LOW);  // apaga\n  delay(1000);            // espera 1 segundo\n}`},
    {t:"mc", q:"¿Cuántas veces se ejecuta setup()?", o:["Una sola vez, al encender","Cada segundo","Nunca","Para siempre"], a:0, ex:"setup() prepara todo; después loop() toma el control."},
    {t:"input", q:"delay(1000) espera 1 segundo. ¿Qué número escribes para esperar medio segundo?", a:["500"], unit:"ms", ex:"delay usa milisegundos: 500 ms = medio segundo."},
    {t:"order", q:"Ordena el código dentro de loop() para que el LED parpadee", code:true, items:["digitalWrite(13, HIGH);","delay(1000);","digitalWrite(13, LOW);","delay(1000);"], ex:"Enciende, espera, apaga, espera. Y loop() lo repite."}
  ]}
]},
{ id:"u4", color:"c", title:"Sensores, los sentidos", desc:"Cómo un robot mide distancia, luz y temperatura.",
  lessons:[
  { id:"u4l1", title:"Ultrasonido HC-SR04", steps:[
    {t:"learn", h:"Ver con sonido, como un murciélago", p:`<p>El sensor <strong>HC-SR04</strong> lanza un sonido muy agudo (que no escuchamos) por el pin <span class="key">Trig</span> y espera el eco por el pin <span class="key">Echo</span>. Cuanto más tarda el eco, más lejos está el objeto.</p>`, fig:"sonar"},
    {t:"learn", h:"La cuenta", p:`<p><strong>distancia = tiempo × velocidad del sonido ÷ 2</strong></p><p>El sonido viaja a unos 0,0343 cm por microsegundo. Se divide entre 2 porque el sonido <span class="key">va y vuelve</span>.</p>`},
    {t:"mc", q:"¿Por qué se divide entre 2?", o:["Porque el sonido va y vuelve","Porque el sensor tiene 2 ojos","Porque el Arduino es lento","Por costumbre"], a:0, ex:"El tiempo medido incluye la ida y la vuelta; la distancia real es la mitad."},
    {t:"match", q:"Une cada pin del HC-SR04 con su función", pairs:[["Trig","Envía el sonido"],["Echo","Recibe el eco"],["VCC","Se conecta a 5 V"],["GND","Se conecta a tierra"]]},
    {t:"mc", q:"El eco tardó 1166 microsegundos. ¿A qué distancia está el objeto?", o:["Unos 20 cm","Unos 40 cm","Unos 2 m","Unos 2 cm"], a:0, ex:"1166 × 0,0343 ÷ 2 ≈ 20 cm."}
  ]},
  { id:"u4l2", title:"Infrarrojo y luz", steps:[
    {t:"learn", h:"Sensor infrarrojo", p:`<p>El sensor <strong>infrarrojo</strong> (por ejemplo el TCRT5000) lanza una luz invisible y mide cuánta rebota. El <span class="key">blanco refleja mucho</span> y el <span class="key">negro refleja poco</span>. Así un robot puede seguir una línea negra en el piso.</p>`},
    {t:"learn", h:"Sensor de luz (LDR)", p:`<p>La <strong>LDR</strong> es una resistencia que cambia con la luz: <span class="key">más luz, menos resistencia</span>. Se lee con un pin analógico y sirve para saber si es de día o de noche.</p>`},
    {t:"tf", q:"Una superficie negra refleja mucha luz infrarroja.", a:false, ex:"El negro absorbe casi toda la luz; por eso el sensor puede distinguir la línea."},
    {t:"mc", q:"¿Qué sensor usarías para que una lámpara se encienda sola al anochecer?", o:["LDR (sensor de luz)","Ultrasonido","Temperatura","Botón"], a:0, ex:"La LDR detecta cuánta luz hay."},
    {t:"mc", q:"Tu robot debe seguir una línea negra en el piso. ¿Qué sensor usas?", o:["Infrarrojo","Micrófono","LDR del techo","Ninguno"], a:0, ex:"El infrarrojo apunta al piso y distingue blanco de negro."}
  ]},
  { id:"u4l3", title:"Más sensores útiles", steps:[
    {t:"learn", h:"Una caja de sentidos", p:`<ul><li><strong>DHT11:</strong> mide temperatura y humedad del aire.</li><li><strong>Botón:</strong> está apretado o no. Se lee con un pin digital.</li><li><strong>Potenciómetro:</strong> una perilla que gira. Se lee con un pin analógico (0 a 1023).</li></ul>`},
    {t:"match", q:"Une cada sensor con lo que mide", pairs:[["DHT11","Temperatura y humedad"],["LDR","Cantidad de luz"],["HC-SR04","Distancia"],["Potenciómetro","Posición de una perilla"]]},
    {t:"mc", q:"Un botón se lee como una entrada…", o:["Digital","Analógica","PWM","De audio"], a:0, ex:"Un botón tiene solo dos estados: apretado o suelto."},
    {t:"tf", q:"Un potenciómetro se lee con analogRead().", a:true, ex:"Da valores intermedios según cuánto lo gires."}
  ]}
]},
{ id:"u5", color:"b", title:"Motores y movimiento", desc:"Haz que tu robot gire, avance y agarre.",
  lessons:[
  { id:"u5l1", title:"El motor DC", steps:[
    {t:"learn", h:"Gira y gira", p:`<p>El <strong>motor DC</strong> gira sin parar mientras recibe energía. Si inviertes los cables, gira al revés. Es el motor de los carritos robot.</p>`},
    {t:"learn", h:"Necesita un ayudante", p:`<p>Un pin de Arduino no da suficiente corriente para un motor y puede dañarse. Por eso se usa un <strong>driver</strong> o <span class="key">puente H</span> (por ejemplo L298N o L9110S): recibe órdenes del Arduino y le pasa la energía de la batería al motor.</p>`, tip:"Con PWM puedes controlar la velocidad: cuanto más alto el valor, más rápido gira."},
    {t:"mc", q:"¿Por qué no se conecta un motor directo a un pin de Arduino?", o:["El pin no da suficiente corriente y puede dañarse","Porque el motor es muy pequeño","Porque gira al revés","Porque no tiene cables"], a:0, ex:"El puente H se encarga de la corriente fuerte."},
    {t:"mc", q:"¿Cómo se cambia el sentido de giro de un motor DC?", o:["Invirtiendo la polaridad (lo hace el puente H)","Apretándolo más","Usando otra batería","No se puede"], a:0, ex:"El puente H puede invertir el + y el − con una orden del Arduino."},
    {t:"tf", q:"Con PWM se puede controlar la velocidad de un motor DC.", a:true, ex:"PWM entrega más o menos energía promedio al motor."}
  ]},
  { id:"u5l2", title:"El servomotor", steps:[
    {t:"learn", h:"Ángulos exactos", p:`<p>El <strong>servomotor</strong> no gira sin parar: va a un <span class="key">ángulo exacto</span> entre 0° y 180° y se queda ahí. Tiene tres cables: energía, GND y señal.</p><p>Es ideal para brazos robóticos, pinzas y timones.</p>`, code:`#include <Servo.h>\nServo miServo;\n\nvoid setup() {\n  miServo.attach(9);  // señal en el pin 9\n  miServo.write(90);  // ir a 90 grados\n}\n\nvoid loop() { }`},
    {t:"mc", q:"¿Qué hace miServo.write(90)?", o:["Mueve el servo a 90 grados","Lo hace girar 90 veces","Espera 90 segundos","Lo apaga"], a:0, ex:"write() indica el ángulo de destino."},
    {t:"match", q:"Une cada pieza con lo que hace mejor", pairs:[["Servomotor","Ir a un ángulo exacto"],["Motor DC","Girar sin parar"],["Puente H","Controlar sentido y potencia del motor"]]},
    {t:"input", q:"¿Cuál es el ángulo máximo de un servomotor común?", a:["180"], unit:"°", ex:"Un servo común se mueve entre 0° y 180°."}
  ]},
  { id:"u5l3", title:"Ruedas y movimiento", steps:[
    {t:"learn", h:"Cómo gira un carrito", p:`<p>Un carrito con dos motores gira usando la <strong>diferencia de velocidad</strong> entre sus ruedas:</p><ul><li><strong>Las dos hacia adelante:</strong> avanza recto.</li><li><strong>Solo la derecha avanza:</strong> gira hacia la izquierda.</li><li><strong>Una adelante y otra atrás:</strong> gira sobre su lugar.</li></ul>`, tip:"Por eso muchos robots solo necesitan dos motores y una rueda loca para moverse en cualquier dirección."},
    {t:"mc", q:"Si solo la rueda izquierda avanza, el robot gira hacia…", o:["La derecha","La izquierda","Atrás","No gira"], a:0, ex:"La rueda izquierda empuja ese lado, así que el robot dobla a la derecha."},
    {t:"mc", q:"¿Cómo gira el robot sobre su propio lugar?", o:["Una rueda adelante y la otra atrás","Las dos ruedas adelante","Apagando los motores","Con una sola rueda"], a:0, ex:"Las ruedas empujan en sentidos opuestos y el robot rota en el lugar."},
    {t:"tf", q:"Una rueda loca es una rueda que gira libre y solo da apoyo.", a:true, ex:"No tiene motor: acompaña el movimiento y mantiene el equilibrio."}
  ]}
]},
{ id:"u6", color:"v", title:"Programar decisiones", desc:"Variables, condiciones, bucles y un seguidor de línea.",
  lessons:[
  { id:"u6l1", title:"Variables y condiciones", steps:[
    {t:"learn", h:"Cajas con nombre", p:`<p>Una <strong>variable</strong> es como una caja con nombre que guarda un valor. Por ejemplo: <code>int distancia = 25;</code></p><p>Con <strong>if / else</strong> el robot elige qué hacer:</p>`, code:`if (distancia < 20) {\n  girar();     // si está cerca: gira\n} else {\n  avanzar();   // si no: sigue adelante\n}`},
    {t:"mc", q:"Con el código anterior, si distancia vale 15, el robot…", o:["Gira","Avanza","Se apaga","Retrocede"], a:0, ex:"15 es menor que 20, así que se cumple el if."},
    {t:"fill", q:"Una ___ guarda un valor con un nombre.", o:["variable","función","resistencia","placa"], a:0, ex:"Las variables guardan datos que el programa usa y cambia."},
    {t:"tf", q:"El bloque else se ejecuta cuando la condición del if es falsa.", a:true, ex:"if = si se cumple; else = si no se cumple."}
  ]},
  { id:"u6l2", title:"Bucles", steps:[
    {t:"learn", h:"Repetir sin copiar", p:`<p>Un <strong>bucle</strong> repite instrucciones. El bucle <strong>for</strong> repite una cantidad fija de veces:</p>`, code:`for (int i = 0; i < 3; i++) {\n  pitar();   // pita 3 veces\n}`, tip:"La función loop() de Arduino ya es un bucle que nunca termina."},
    {t:"input", q:"¿Cuántas veces se repite for (int i = 0; i < 5; i++)?", a:["5"], unit:"veces", ex:"i vale 0, 1, 2, 3 y 4: son 5 vueltas."},
    {t:"mc", q:"¿Qué bucle infinito trae Arduino ya hecho?", o:["loop()","setup()","delay()","for()"], a:0, ex:"loop() se repite mientras la placa tenga energía."},
    {t:"tf", q:"Un bucle sirve para no escribir la misma instrucción muchas veces.", a:true, ex:"Esa es su gran ventaja."}
  ]},
  { id:"u6l3", title:"Robot seguidor de línea", steps:[
    {t:"learn", h:"Dos sensores, tres reglas", p:`<p>El robot tiene dos sensores infrarrojos, uno a cada lado de la línea negra:</p>`, fig:"line"},
    {t:"learn", h:"Las reglas", p:`<ul><li><strong>Los dos ven blanco:</strong> la línea está en el medio → <span class="key">avanzar</span>.</li><li><strong>El izquierdo ve negro:</strong> la línea se fue a la izquierda → <span class="key">girar a la izquierda</span>.</li><li><strong>El derecho ve negro:</strong> la línea se fue a la derecha → <span class="key">girar a la derecha</span>.</li></ul>`},
    {t:"mc", q:"El sensor derecho ve negro y el izquierdo ve blanco. ¿Qué hace el robot?", o:["Gira a la derecha","Gira a la izquierda","Avanza recto","Se detiene"], a:0, ex:"La línea quedó del lado derecho, así que gira hacia ella."},
    {t:"mc", q:"Los dos sensores ven blanco. ¿Qué hace el robot?", o:["Avanza recto","Gira a la derecha","Retrocede","Gira a la izquierda"], a:0, ex:"La línea está justo entre los dos sensores."},
    {t:"order", q:"Ordena lo que hace el programa en cada vuelta de loop()", items:["Leer los dos sensores","Comparar con las reglas","Mover los motores","Volver a empezar"], ex:"Sentir, pensar, actuar… ¡como en la primera lección!"}
  ]}
]},
{ id:"u7", color:"c", title:"Energía y baterías", desc:"Pilas, conexiones en serie y cómo trabajar seguro.",
  lessons:[
  { id:"u7l1", title:"Pilas y baterías", steps:[
    {t:"learn", h:"La comida del robot", p:`<ul><li><strong>Pila AA común:</strong> 1,5 V. No se recarga.</li><li><strong>Pila recargable AA (NiMH):</strong> 1,2 V.</li><li><strong>Batería de litio (Li-ion, 18650):</strong> 3,7 V. Se recarga y es muy usada en robots.</li><li><strong>Batería de 9 V:</strong> práctica, pero dura poco con motores.</li></ul><p>La <span class="key">capacidad</span> se mide en <strong>mAh</strong> (miliamperios hora): cuanto más grande el número, más dura.</p>`},
    {t:"input", q:"¿Cuántos voltios tiene una pila AA común?", a:["1.5"], unit:"V", ex:"Una pila AA alcalina tiene 1,5 V."},
    {t:"mc", q:"¿Qué indica el número en mAh de una batería?", o:["Cuánto tiempo puede durar (su capacidad)","Su tamaño","Su color","La velocidad del robot"], a:0, ex:"Más mAh = más energía guardada = más tiempo de uso."},
    {t:"tf", q:"Con el mismo robot, una batería de 2000 mAh dura más que una de 1000 mAh.", a:true, ex:"Guarda el doble de energía, así que dura más o menos el doble."}
  ]},
  { id:"u7l2", title:"En serie y en paralelo", steps:[
    {t:"learn", h:"Sumar voltios", p:`<p>Si unes pilas <strong>en serie</strong> (el + de una con el − de la otra), los <span class="key">voltios se suman</span>.</p>`, fig:"series"},
    {t:"learn", h:"Sumar duración", p:`<p>Si las unes <strong>en paralelo</strong> (todos los + juntos y todos los − juntos), el <span class="key">voltaje queda igual</span>, pero el conjunto <span class="key">dura más</span>.</p>`},
    {t:"input", q:"Pones 4 pilas AA de 1,5 V en serie. ¿Cuántos voltios obtienes?", a:["6"], unit:"V", ex:"1,5 × 4 = 6 V."},
    {t:"match", q:"Une cada conexión con lo que logra", pairs:[["En serie","Suma los voltios"],["En paralelo","Suma la duración"]]},
    {t:"mc", q:"Dos baterías de 3,7 V en paralelo dan…", o:["3,7 V, pero duran más","7,4 V","1,85 V","0 V"], a:0, ex:"En paralelo el voltaje no cambia."}
  ]},
  { id:"u7l3", title:"Trabajar seguro", steps:[
    {t:"learn", h:"Reglas de oro", p:`<ul><li><strong>Nunca unas el + y el − de una batería con un cable directo.</strong> Eso es un <span class="key">cortocircuito</span>: el cable se calienta y la batería se puede dañar.</li><li><strong>Desconecta la energía</strong> antes de cambiar cables.</li><li><strong>Baterías de litio:</strong> no las golpees, no las perfores y cárgalas con un cargador adecuado y con un adulto cerca.</li><li>Si algo huele a quemado o se calienta mucho, <strong>desconecta enseguida</strong>.</li></ul>`},
    {t:"tf", q:"Puedo unir el + y el − de una batería con un cable para probar si funciona.", a:false, ex:"Eso es un cortocircuito: es peligroso y daña la batería."},

const FUND = { id:"uf", color:"b", title:"Fundamentos de la robótica", desc:"Control, mecánica, movimiento, inteligencia artificial y seguridad.",
  lessons:[
  { id:"ufl1", title:"Lazo abierto y lazo cerrado", steps:[
    {t:"learn", h:"Dos formas de controlar", p:`<p>El <strong>control</strong> es la forma en que un robot logra lo que quiere.</p><ul><li><strong>Lazo abierto:</strong> da la orden y <span class="key">no revisa</span> el resultado. Como un tostador con temporizador: tuesta 2 minutos aunque el pan ya esté quemado.</li><li><strong>Lazo cerrado:</strong> da la orden, <span class="key">mide el resultado con un sensor y corrige</span>. Como el aire acondicionado: mide la temperatura y se apaga cuando llega a la que pediste.</li></ul>`, fig:"loop"},
    {t:"learn", h:"La retroalimentación", p:`<p>Cuando el sensor le “cuenta” al controlador cómo salió la acción, eso se llama <span class="key">retroalimentación</span>. Es la base de casi todos los robots: sin ella, un seguidor de línea se saldría en la primera curva.</p>`, tip:"Tu cuerpo usa lazo cerrado todo el tiempo: si vas a agarrar un vaso, tus ojos corrigen la mano mientras se mueve."},
    {t:"mc", q:"Un horno que se apaga solo cuando llega a 180 °C usa…", o:["Lazo cerrado","Lazo abierto","Ningún control","Bluetooth"], a:0, ex:"Mide la temperatura con un sensor y corrige: es lazo cerrado."},
    {t:"tf", q:"En lazo abierto el robot revisa si su acción salió bien.", a:false, ex:"El lazo abierto no revisa: solo ejecuta la orden."},
    {t:"fill", q:"Cuando el sensor le informa al control cómo salió la acción, eso se llama ___.", o:["retroalimentación","cortocircuito","compilación","autonomía"], a:0, ex:"La retroalimentación permite corregir errores."}
  ]},
  { id:"ufl2", title:"Mecánica: engranajes, poleas y palancas", steps:[
    {t:"learn", h:"Transmitir el movimiento", p:`<p>Un motor gira, pero el robot necesita mover ruedas, brazos o pinzas. Para llevar ese movimiento se usan <strong>mecanismos</strong>:</p><ul><li><strong>Engranajes:</strong> ruedas con dientes que se empujan entre sí.</li><li><strong>Poleas y correas:</strong> ruedas unidas por una correa, como en una bicicleta.</li><li><strong>Palancas:</strong> barras que giran sobre un punto y multiplican la fuerza.</li></ul>`},
    {t:"learn", h:"Fuerza o velocidad", p:`<p>Si un engranaje chico mueve a uno grande, el grande gira <span class="key">más lento pero con más fuerza</span>. Al revés, gana velocidad y pierde fuerza. A eso se le llama <strong>relación de transmisión</strong>.</p>`, fig:"gears"},
    {t:"mc", q:"Un engranaje de 10 dientes mueve a uno de 20. El de 20…", o:["Gira más lento con más fuerza","Gira más rápido con más fuerza","No gira","Gira igual"], a:0, ex:"Da media vuelta por cada vuelta del chico, pero con el doble de fuerza."},
    {t:"match", q:"Une cada mecanismo con su ejemplo", pairs:[["Engranajes","Caja de cambios"],["Polea y correa","Cadena de bicicleta"],["Palanca","Sube y baja de la plaza"]]},
    {t:"tf", q:"Una palanca puede ayudar a levantar algo pesado con menos fuerza.", a:true, ex:"Por eso con una pala puedes mover una piedra grande."}
  ]},
  { id:"ufl3", title:"Grados de libertad y efector final", steps:[
    {t:"learn", h:"¿Cuánto se puede mover?", p:`<p>Los <strong>grados de libertad</strong> son la cantidad de movimientos independientes que puede hacer un robot. Cada articulación que gira o se desliza suma uno.</p><ul><li>Una puerta: <span class="key">1</span> grado (solo gira en sus bisagras).</li><li>Un brazo robótico industrial: suele tener <span class="key">6</span>.</li><li>Tu brazo: <span class="key">7</span> (hombro 3, codo 1, muñeca 3).</li></ul>`},
    {t:"learn", h:"La mano del robot", p:`<p>La herramienta que está en la punta del brazo se llama <strong>efector final</strong>. Puede ser una pinza, una ventosa, un soldador, un pincel o hasta un taladro. Cambiando el efector, el mismo brazo hace trabajos distintos.</p>`},
    {t:"input", q:"¿Cuántos grados de libertad tiene una puerta común?", a:["1"], unit:"", ex:"Solo puede girar sobre sus bisagras."},
    {t:"mc", q:"La pinza en la punta de un brazo robótico se llama…", o:["Efector final","Chasis","Sensor","Batería"], a:0, ex:"Es la “mano” o herramienta del robot."},
    {t:"tf", q:"Un robot con más grados de libertad puede hacer movimientos más complejos.", a:true, ex:"Más articulaciones permiten llegar a más posiciones."}
  ]},
  { id:"ufl4", title:"Cómo ve y aprende un robot", steps:[
    {t:"learn", h:"Visión artificial", p:`<p>Muchos robots usan una <strong>cámara</strong> como sensor. Una imagen, para la computadora, es una grilla de miles de puntitos de color llamados <span class="key">píxeles</span>. Con programas especiales el robot reconoce formas, colores, caras u objetos.</p>`},
    {t:"learn", h:"Inteligencia artificial", p:`<p>La <strong>inteligencia artificial (IA)</strong> permite que una máquina aprenda <span class="key">a partir de ejemplos</span> en lugar de seguir solo reglas escritas a mano. Si le muestras miles de fotos de manzanas, aprende a reconocer manzanas nuevas.</p><p>Pero la IA <strong>se puede equivocar</strong>: si los ejemplos son pocos o están mal elegidos, aprende mal.</p>`, tip:"En octubre de 2026 se presentaron varios modelos de IA para que los robots entiendan dónde y cómo agarrar objetos. ¡La robótica y la IA avanzan juntas!"},
    {t:"mc", q:"¿Cómo aprende una inteligencia artificial?", o:["A partir de muchos ejemplos","Leyendo la mente","Sin ningún dato","Solo con electricidad"], a:0, ex:"Los ejemplos (datos) son su forma de aprender."},
    {t:"tf", q:"La inteligencia artificial nunca se equivoca.", a:false, ex:"Puede equivocarse, sobre todo si aprendió con malos ejemplos."},
    {t:"fill", q:"Una imagen digital está formada por puntitos llamados ___.", o:["píxeles","bytes","voltios","engranajes"], a:0, ex:"Cuantos más píxeles, más detalle tiene la imagen."}
  ]},
  { id:"ufl5", title:"Seguridad y ética", steps:[
    {t:"learn", h:"Robots seguros", p:`<ul><li><strong>Parada de emergencia:</strong> un botón grande y rojo que apaga todo al instante.</li><li><strong>Zonas de seguridad:</strong> en las fábricas, los robots grandes trabajan detrás de rejas o con sensores que los frenan si alguien se acerca.</li><li><strong>Cobots:</strong> robots colaborativos diseñados para trabajar al lado de personas sin lastimarlas.</li></ul>`},
    {t:"learn", h:"Ética: usar la tecnología para bien", p:`<p>La <strong>ética</strong> se pregunta qué está bien y qué está mal. En robótica se discute, por ejemplo:</p><ul><li>¿Quién es responsable si un robot se equivoca?</li><li>¿Cómo cuidamos la privacidad si un robot tiene cámaras?</li><li>¿Cómo ayudamos a las personas cuyos trabajos cambian por la automatización?</li></ul>`, tip:"Las Tres Leyes de Asimov son ciencia ficción, pero inspiran una idea real: <b>la seguridad de las personas va primero</b>."},
    {t:"mc", q:"¿Para qué sirve el botón de parada de emergencia?", o:["Para apagar el robot al instante si algo sale mal","Para encenderlo","Para cambiar de color","Para cargar la batería"], a:0, ex:"Es la medida de seguridad más importante de un robot."},
    {t:"mc", q:"¿Qué es un cobot?", o:["Un robot que trabaja al lado de personas de forma segura","Un robot de juguete","Un control remoto","Un tipo de batería"], a:0, ex:"Colaborativo + robot = cobot."},
    {t:"tf", q:"En robótica, la seguridad de las personas va primero.", a:true, ex:"Es la regla de oro de cualquier robot."}
  ]}
]};

/* ---------- Ruta 2: Tecnología e informática ---------- */
const TECH_UNITS = [
{ id:"t1", color:"c", title:"La computadora por dentro", desc:"Hardware, software y cómo trabaja una computadora.",
  lessons:[
  { id:"t1l1", title:"Hardware y software", steps:[
    {t:"learn", h:"El cuerpo y las ideas", p:`<ul><li><strong>Hardware</strong> es todo lo que se puede tocar: pantalla, teclado, placa, cables.</li><li><strong>Software</strong> son los programas: las instrucciones que le dicen al hardware qué hacer.</li></ul><p>El programa más importante es el <span class="key">sistema operativo</span> (Windows, Android, Linux, iOS): organiza todo y deja que funcionen las demás aplicaciones.</p>`, tip:"Una forma de recordarlo: el hardware es el cuerpo de la computadora y el software, sus ideas."},
    {t:"match", q:"Une cada cosa con lo que es", pairs:[["Teclado","Hardware"],["Juego instalado","Software"],["Android","Sistema operativo"]]},
    {t:"mc", q:"¿Cuál de estos es software?", o:["Un navegador web","Un mouse","Un monitor","Un cable USB"], a:0, ex:"El navegador es un programa: no se puede tocar."},
    {t:"tf", q:"El sistema operativo es un tipo de hardware.", a:false, ex:"Es software: el programa base de la computadora."}
  ]},
  { id:"t1l2", title:"Procesador, memoria y almacenamiento", steps:[
    {t:"learn", h:"Las piezas principales", p:`<ul><li><strong>Procesador (CPU):</strong> el cerebro. Hace millones de cálculos por segundo.</li><li><strong>Memoria RAM:</strong> la mesa de trabajo. Guarda lo que estás usando ahora y se borra al apagar.</li><li><strong>Almacenamiento (disco o SSD):</strong> el armario. Guarda tus archivos aunque apagues.</li><li><strong>Entrada y salida:</strong> teclado y micrófono meten datos; pantalla y parlantes los muestran.</li></ul>`},
    {t:"match", q:"Une cada pieza con su función", pairs:[["CPU","Hace los cálculos"],["RAM","Guarda lo que usas ahora"],["Disco o SSD","Guarda archivos al apagar"]]},
    {t:"mc", q:"¿Qué pasa con la memoria RAM al apagar la computadora?", o:["Se borra","Se duplica","Se guarda para siempre","Se convierte en disco"], a:0, ex:"La RAM es temporal; lo permanente va al almacenamiento."},
    {t:"mc", q:"El micrófono es un dispositivo de…", o:["Entrada","Salida","Almacenamiento","Procesamiento"], a:0, ex:"Mete información (sonido) en la computadora."}
  ]}
]},
{ id:"t2", color:"b", title:"El lenguaje de las máquinas", desc:"Bits, bytes y cómo se guarda la información.",
  lessons:[
  { id:"t2l1", title:"Bits y sistema binario", steps:[
    {t:"learn", h:"Todo es 0 y 1", p:`<p>Las computadoras solo entienden dos estados: <span class="key">hay corriente (1)</span> o <span class="key">no hay corriente (0)</span>. Cada 0 o 1 se llama <strong>bit</strong>.</p><p>Juntando bits se representa cualquier cosa: números, letras, colores, sonidos. Este sistema de solo dos dígitos se llama <strong>binario</strong>.</p>`},
    {t:"learn", h:"Contar en binario", p:`<p>En binario cada posición vale el doble que la anterior: 1, 2, 4, 8…</p><ul><li><code>1</code> = 1</li><li><code>10</code> = 2</li><li><code>11</code> = 2 + 1 = 3</li><li><code>101</code> = 4 + 1 = 5</li></ul>`},
    {t:"input", q:"¿Cuánto vale el número binario 11 en decimal?", a:["3"], unit:"", ex:"2 + 1 = 3."},
    {t:"tf", q:"Un bit puede valer 0, 1 o 2.", a:false, ex:"Un bit solo puede valer 0 o 1."},
    {t:"mc", q:"¿Por qué las computadoras usan binario?", o:["Porque sus circuitos solo distinguen dos estados: con o sin corriente","Porque es más lindo","Porque lo eligió un rey","Porque no saben contar"], a:0, ex:"Encendido y apagado: 1 y 0."}
  ]},
  { id:"t2l2", title:"Bytes, megas y gigas", steps:[
    {t:"learn", h:"Medir la información", p:`<ul><li><strong>1 byte</strong> = 8 bits. Alcanza para guardar una letra.</li><li><strong>1 KB</strong> (kilobyte) ≈ mil bytes: una página de texto.</li><li><strong>1 MB</strong> (megabyte) ≈ mil KB: una foto.</li><li><strong>1 GB</strong> (gigabyte) ≈ mil MB: una película.</li><li><strong>1 TB</strong> (terabyte) ≈ mil GB: un disco grande.</li></ul>`, tip:"Una imagen es una grilla de píxeles; cada píxel guarda su color con números. Por eso las fotos pesan megas."},
    {t:"input", q:"¿Cuántos bits tiene un byte?", a:["8"], unit:"bits", ex:"1 byte = 8 bits."},
    {t:"order", q:"Ordena de menor a mayor", items:["Byte","Kilobyte (KB)","Megabyte (MB)","Gigabyte (GB)"], ex:"Cada uno es unas mil veces el anterior."},
    {t:"mc", q:"¿Qué ocupa normalmente más espacio?", o:["Una película","Una letra","Un mensaje corto","Un número"], a:0, ex:"Una película pesa gigas; una letra, un byte."}
  ]}
]},
{ id:"t3", color:"v", title:"Internet y redes", desc:"Cómo viaja la información y cómo funciona una página web.",
  lessons:[
  { id:"t3l1", title:"¿Qué es internet?", steps:[
    {t:"learn", h:"Una red de redes", p:`<p><strong>Internet</strong> es una red gigante que conecta millones de computadoras en todo el mundo. La información viaja en pedacitos llamados <span class="key">paquetes</span>, por cables, fibra óptica, antenas y hasta satélites.</p><ul><li><strong>Router:</strong> el aparato que reparte internet en tu casa.</li><li><strong>Wi-Fi:</strong> conexión sin cables por ondas de radio.</li><li><strong>Dirección IP:</strong> el “número de casa” de cada dispositivo en la red.</li></ul>`},
    {t:"mc", q:"¿Qué es la dirección IP?", o:["El número que identifica a un dispositivo en la red","Una contraseña","Un tipo de cable","Un juego"], a:0, ex:"Como la dirección de una casa, pero para computadoras."},
    {t:"tf", q:"El Wi-Fi funciona por ondas de radio, sin cables.", a:true, ex:"Por eso puedes conectarte desde cualquier parte de la casa."},
    {t:"fill", q:"La información viaja por internet en pedacitos llamados ___.", o:["paquetes","píxeles","engranajes","voltios"], a:0, ex:"Se separan al salir y se vuelven a juntar al llegar."}
  ]},
  { id:"t3l2", title:"Páginas web y la nube", steps:[
    {t:"learn", h:"Cómo se hace una página web", p:`<p>Las páginas web, como NEXOR, se escriben con tres lenguajes:</p><ul><li><strong>HTML:</strong> la estructura (títulos, textos, botones).</li><li><strong>CSS:</strong> el diseño (colores, tamaños, tipografías).</li><li><strong>JavaScript:</strong> la interacción (lo que pasa al tocar un botón).</li></ul><p>Un <span class="key">navegador</span> (Chrome, Firefox, Safari) lee esos archivos y te muestra la página.</p>`},
    {t:"learn", h:"La nube", p:`<p>“Guardar en la nube” significa guardar tus archivos en <strong>computadoras de otras empresas</strong> (servidores) a las que accedes por internet. Así puedes ver tus fotos desde cualquier dispositivo.</p>`},
    {t:"match", q:"Une cada lenguaje con su trabajo", pairs:[["HTML","Estructura"],["CSS","Diseño"],["JavaScript","Interacción"]]},
    {t:"mc", q:"¿Qué es la nube?", o:["Servidores en internet donde se guardan datos","El cielo","Un tipo de pantalla","Un virus"], a:0, ex:"Son computadoras reales, solo que no están en tu casa."}
  ]}
]},
{ id:"t4", color:"c", title:"Pensamiento computacional", desc:"Resolver problemas como lo haría una computadora.",
  lessons:[
  { id:"t4l1", title:"Los 4 pilares", steps:[
    {t:"learn", h:"Pensar como programador", p:`<ul><li><strong>Descomposición:</strong> dividir un problema grande en partes chicas.</li><li><strong>Patrones:</strong> encontrar cosas que se repiten.</li><li><strong>Abstracción:</strong> quedarse con lo importante e ignorar los detalles que no sirven.</li><li><strong>Algoritmo:</strong> escribir los pasos ordenados para resolverlo.</li></ul>`, tip:"Hacer un sándwich también es un algoritmo: si te saltas un paso, ¡queda sin pan!"},
    {t:"match", q:"Une cada pilar con su significado", pairs:[["Descomposición","Dividir en partes"],["Patrones","Encontrar repeticiones"],["Abstracción","Quedarse con lo importante"],["Algoritmo","Pasos ordenados"]]},
    {t:"order", q:"Ordena el algoritmo para lavarse los dientes", items:["Poner pasta en el cepillo","Cepillar los dientes","Enjuagarse la boca","Guardar el cepillo"], ex:"El orden importa: eso es un algoritmo."},
    {t:"tf", q:"Un algoritmo es una lista de pasos ordenados para resolver un problema.", a:true, ex:"Las computadoras siguen algoritmos todo el tiempo."}
  ]},
  { id:"t4l2", title:"Pseudocódigo y diagramas", steps:[
    {t:"learn", h:"Escribir antes de programar", p:`<p>El <strong>pseudocódigo</strong> es escribir un programa en tu idioma, sin preocuparte por un lenguaje real:</p>`, code:`SI está lloviendo ENTONCES\n   llevar paraguas\nSI NO\n   llevar gorra\nFIN SI`},
    {t:"learn", h:"Diagramas de flujo", p:`<p>Un <strong>diagrama de flujo</strong> dibuja el algoritmo con formas:</p><ul><li><strong>Óvalo:</strong> inicio y fin.</li><li><strong>Rectángulo:</strong> una acción.</li><li><strong>Rombo:</strong> una pregunta con respuesta sí o no.</li></ul>`},
    {t:"mc", q:"En un diagrama de flujo, ¿qué forma tiene una pregunta?", o:["Rombo","Óvalo","Círculo","Estrella"], a:0, ex:"El rombo se usa para decisiones."},
    {t:"mc", q:"Con el pseudocódigo de arriba, si no llueve…", o:["Llevas gorra","Llevas paraguas","No sales","Llevas las dos cosas"], a:0, ex:"Se ejecuta la parte del SI NO."}
  ]}
]},
{ id:"t5", color:"b", title:"Ciudadanía digital", desc:"Cuidarte y cuidar a otros en internet.",
  lessons:[
  { id:"t5l1", title:"Contraseñas y estafas", steps:[
    {t:"learn", h:"Contraseñas fuertes", p:`<ul><li>Larga: <span class="key">12 caracteres o más</span>.</li><li>Mezcla mayúsculas, minúsculas, números y símbolos, o usa una frase: <code>MiPerroComePizza#27</code>.</li><li>Una distinta para cada cuenta.</li><li><strong>Nunca</strong> la compartas, ni con amigos.</li><li>Activa la <strong>verificación en dos pasos</strong> cuando puedas.</li></ul>`},
    {t:"learn", h:"Phishing: el anzuelo", p:`<p>El <strong>phishing</strong> es un engaño: un mensaje que parece de un banco, un juego o una red social, pero que busca robar tu contraseña. Señales de alerta:</p><ul><li>Te apura (“¡Tu cuenta se borra en 1 hora!”).</li><li>Te promete premios gratis.</li><li>El enlace tiene una dirección rara.</li></ul>`},
    {t:"mc", q:"¿Cuál es la contraseña más segura?", o:["Tortuga$Azul_Vuela92","123456","contraseña","tunombre"], a:0, ex:"Es larga y mezcla tipos de caracteres."},
    {t:"tf", q:"Si un mensaje dice que ganaste un premio y te pide la contraseña, es seguro dársela.", a:false, ex:"Es phishing: nadie legítimo te pide la contraseña."},
    {t:"mc", q:"¿Qué haces si un amigo te pide tu contraseña?", o:["No se la doy","Se la doy","Se la doy si es mi mejor amigo","La publico"], a:0, ex:"Las contraseñas no se comparten con nadie."}
  ]},
  { id:"t5l2", title:"Huella digital y noticias falsas", steps:[
    {t:"learn", h:"Lo que publicas queda", p:`<p>Todo lo que haces en internet deja una <strong>huella digital</strong>: fotos, comentarios, búsquedas. Aunque lo borres, alguien pudo guardarlo. Antes de publicar pregúntate: <span class="key">¿me molestaría que lo viera cualquier persona dentro de 10 años?</span></p>`},
    {t:"learn", h:"¿Es verdad?", p:`<p>Para no caer en <strong>noticias falsas</strong>:</p><ul><li>Fíjate quién la publica y si otros medios serios dicen lo mismo.</li><li>Mira la fecha: a veces circulan noticias viejas.</li><li>Desconfía de títulos exagerados.</li><li>Ojo con imágenes y videos: hoy la IA puede crear algunos que parecen reales.</li></ul>`},
    {t:"tf", q:"Si borro una foto de internet, desaparece para siempre.", a:false, ex:"Alguien pudo descargarla o hacerle captura."},
    {t:"mc", q:"¿Qué haces antes de compartir una noticia sorprendente?", o:["Verificar si otros medios serios dicen lo mismo","Compartirla rápido","Cambiarle el título","Nada"], a:0, ex:"Comparar fuentes es la mejor defensa."}

let AC=null;
function tone(seq){
  if(!P || !P.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = AC.currentTime;
    seq.forEach(([f,d,st])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0+st); g.gain.exponentialRampToValueAtTime(.16,t0+st+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+st+d);
      o.connect(g); g.connect(AC.destination); o.start(t0+st); o.stop(t0+st+d+.05); });
  }catch(e){}
}

async function sha(s){
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))|0; return "x"+(h>>>0).toString(16); }
}

/* ---------- Archivos (documentos y presentaciones) ---------- */
const FILE_MAX = 25*1024*1024, FILE_COUNT = 3, CHUNK = 900000, UPLOAD_PARALLEL = 4;
const FILE_ACCEPT = ".pdf,.ppt,.pptx,.pps,.ppsx,.doc,.docx,.xls,.xlsx,.odt,.odp,.ods,.txt,.rtf,.zip";
const FILESTORE = (()=>{
  const mem = {}; let dbp = null;
  const open = () => dbp || (dbp = new Promise((res,rej)=>{ try{ const r=indexedDB.open("nexor_files",1); r.onupgradeneeded=()=>r.result.createObjectStore("f"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }));
  const tx = (mode, fn) => open().then(db=>new Promise((res,rej)=>{ const t=db.transaction("f",mode), st=t.objectStore("f"), r=fn(st); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }));
  return {
    async put(id,v){ try{ await tx("readwrite", st=>st.put(v,id)); }catch(e){ mem[id]=v; } },
    async get(id){ if(mem[id]) return mem[id]; try{ return await tx("readonly", st=>st.get(id)); }catch(e){ return null; } },
    async del(id){ delete mem[id]; try{ await tx("readwrite", st=>st.delete(id)); }catch(e){} }
  };
})();
const fmtSize = b => b<1024*1024 ? `${Math.max(1,Math.round(b/1024))} KB` : `${(b/1024/1024).toFixed(1).replace(".",",")} MB`;
const extOf = n => (String(n).split(".").pop()||"").toLowerCase();
function fileKind(name){ const x=extOf(name);
  if(["ppt","pptx","pps","ppsx","odp","key"].includes(x)) return ["Presentación","slides","t-presentacion"];
  if(["doc","docx","odt","rtf","txt"].includes(x)) return ["Documento","doc","t-documento"];
  if(x==="pdf") return ["PDF","doc","t-pdf"];
  if(["xls","xlsx","ods","csv"].includes(x)) return ["Planilla","doc","t-planilla"];
  return ["Archivo","doc","t-archivo"]; }
function readFileB64(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]||""); fr.onerror=()=>rej(new Error("No se pudo leer el archivo.")); fr.readAsDataURL(file); }); }
function b64ToBytes(s){ const bin=atob(s), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
async function downloadFile(meta){
  toast(meta.size>3*1024*1024 ? `Descargando ${fmtSize(meta.size)}… puede tardar unos segundos.` : "Preparando la descarga…","doc");
  const f = await DB.getFile(meta.id);
  if(!f || (!f.blob && !f.data)) throw new Error("No se encontró el archivo. Puede que se haya borrado.");
  const blob = f.blob ? (f.blob.type||!f.type ? f.blob : new Blob([f.blob],{type:f.type})) : new Blob([b64ToBytes(f.data)], {type:f.type||"application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a"); link.href=url; link.download=f.name||meta.name||"archivo"; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

/* ---------- Base de datos local (modo prueba) ---------- */
function makeLocalDB(){
  const K = "nexor_db_v3";
  let D = lsGet(K) || { users:{}, progress:{}, projects:SEED.map(p=>({...p})), ideas:[], lessons:[], session:null };
  const w = () => lsSet(K, D);
  let cb = null;
  const cur = () => { const u = D.session && D.users[D.session]; return u ? {uid:D.session, email:u.email, name:u.name, verified:true} : null; };
  const clone = o => JSON.parse(JSON.stringify(o));
  return {
    mode:"local",
    async init(f){ cb=f; await f(cur()); },
    async register({email,pass,name}){
      if(Object.values(D.users).some(u=>u.email===email)) throw {code:"auth/email-already-in-use"};
      const id="u"+uid36(), salt=uid36();
      D.users[id] = {email, name, salt, hash: await sha(salt+pass), created:Date.now()};
      D.session=id;
      if(!w()){ delete D.users[id]; D.session=null; throw {code:"storage"}; }
      await cb(cur());
    },
    async login(email,pass){
      const e = Object.entries(D.users).find(([,u])=>u.email===email);
      if(!e) throw {code:"local/no-user"};
      if(e[1].hash !== await sha(e[1].salt+pass)) throw {code:"auth/wrong-password"};
      D.session=e[0]; w(); await cb(cur());
    },
    async logout(){ D.session=null; w(); await cb(null); },
    async demoAdmin(){
      let e = Object.entries(D.users).find(([,u])=>u.email===ADMINS[0]);
      if(!e){ const id="u"+uid36(), salt=uid36(); D.users[id]={email:ADMINS[0], name:"Admin de prueba", salt, hash:await sha(salt+uid36()), created:Date.now()}; e=[id]; }
      D.session=e[0]; w(); await cb(cur());
    },
    async reset(){ throw {code:"local/no-reset"}; },
    async google(){ throw {code:"local/no-google"}; }, async linkGoogle(){ throw {code:"local/no-google"}; }, providers(){ return ["password"]; },
    async resendVerify(){}, async refreshUser(){ return cur(); },
    async updateProfile({name}){ const u=D.users[D.session]; u.name=name; w(); return cur(); },
    async loadProgress(){ return D.progress[D.session] ? clone(D.progress[D.session]) : null; },
    saveProgress(p){ if(!D.session) return; D.progress[D.session]=clone(p); return w(); },
    async listProjects(){ return clone(D.projects); },
    async addProject(p){ const id="p-"+uid36(); D.projects.push({...p,id}); if(!w()){ D.projects.pop(); throw {code:"storage"}; } return id; },
    async updateProject(id,patch){ const p=D.projects.find(x=>x.id===id); const old=clone(p); Object.assign(p,patch); if(!w()){ Object.assign(p,old); throw {code:"storage"}; } },
    async deleteProject(id){ const p=D.projects.find(x=>x.id===id); (p&&p.files||[]).forEach(f=>FILESTORE.del(f.id)); D.projects=D.projects.filter(x=>x.id!==id); w(); },
    async addFile(f, onProg){ if(!f.file) throw new Error("Vuelve a elegir el archivo"); const id="f-"+uid36(); await FILESTORE.put(id,{name:f.name,type:f.type,size:f.size,blob:new Blob([await f.file.arrayBuffer()],{type:f.type||"application/octet-stream"})}); if(onProg) onProg(1); return id; },
    async getFile(id){ return await FILESTORE.get(id); },
    async deleteFile(id){ await FILESTORE.del(id); },

/* ---------- Firebase (modo real) ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("No se pudo cargar "+src)); document.head.appendChild(s); }); }
async function makeFirebaseDB(){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js"]) await loadScript(base+f);
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), fs = firebase.firestore(), FV = firebase.firestore.FieldValue;
  auth.getRedirectResult().catch(e=>{ if(e && e.code) setTimeout(()=>toast(errMsg(e),"info","err"),500); });
  let profile = {}, saveT = null, cb = null;
  const docs = s => s.docs.map(d=>({...d.data(), id:d.id}));
  const toUser = async u => {
    if(!u) return null;
    try { const d = await fs.collection("users").doc(u.uid).get(); profile = d.exists ? d.data() : {};
      if(!d.exists || !profile.name || !profile.email){ profile.name = profile.name || u.displayName || "Explorador/a"; profile.created = profile.created||Date.now();
        await fs.collection("users").doc(u.uid).set({name:profile.name, email:(u.email||"").toLowerCase(), created:profile.created},{merge:true});
        await fs.collection("leaderboard").doc(u.uid).set({name:profile.name, created:profile.created, updated:Date.now()},{merge:true}).catch(()=>{}); } } catch(e){ profile = profile||{}; }
    return {uid:u.uid, email:(u.email||"").toLowerCase(), name:profile.name||u.displayName||"Explorador/a", verified:!!u.emailVerified};
  };
  const mergeById = (...lists) => { const m=new Map(); lists.flat().forEach(x=>m.set(x.id,x)); return [...m.values()]; };
  const clean = o => JSON.parse(JSON.stringify(o));
  return {
    mode:"firebase",
    init(f){ cb=f; return new Promise(res=>{ let first=true; auth.onAuthStateChanged(async u=>{ await f(await toUser(u)); if(first){ first=false; res(); } }); }); },
    async register({email,pass,name}){
      const c = await auth.createUserWithEmailAndPassword(email,pass);
      await c.user.updateProfile({displayName:name});
      await fs.collection("users").doc(c.user.uid).set({name, email:email.toLowerCase(), created:Date.now()}, {merge:true});
      await fs.collection("leaderboard").doc(c.user.uid).set({name, xp:0, streak:0, league:0, week:weekKey(), weekXp:0, created:Date.now(), updated:Date.now()}, {merge:true}).catch(()=>{});
      try { await c.user.sendEmailVerification(); } catch(e){}
      await cb(await toUser(auth.currentUser));
    },
    async login(email,pass){ await auth.signInWithEmailAndPassword(email,pass); },
    async google(){ const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
      try{ await auth.signInWithPopup(p); }
      catch(e){ if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(e.code)){ await auth.signInWithRedirect(p); return; } throw e; } },
    async linkGoogle(){ const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
      await auth.currentUser.linkWithPopup(p); await auth.currentUser.reload(); USER = await toUser(auth.currentUser); },
    providers(){ return (auth.currentUser?auth.currentUser.providerData:[]).map(x=>x.providerId); },
    async logout(){ clearTimeout(saveT); await auth.signOut(); },
    async reset(email){ await auth.sendPasswordResetEmail(email); },
    async resendVerify(){ if(auth.currentUser) await auth.currentUser.sendEmailVerification(); },
    async refreshUser(){ const u=auth.currentUser; if(!u) return null; await u.reload(); await u.getIdToken(true); return toUser(auth.currentUser); },
    async updateProfile({name}){ const u=auth.currentUser; await fs.collection("users").doc(u.uid).set({name},{merge:true}); await fs.collection("leaderboard").doc(u.uid).set({name},{merge:true}); return toUser(u); },
    async loadProgress(){ return profile.progress || null; },
    saveProgress(p){
      clearTimeout(saveT);
      saveT = setTimeout(()=>{ const u=auth.currentUser; if(!u) return;
        fs.collection("users").doc(u.uid).set({progress:clean(p)},{merge:true}).catch(()=>toast("No se pudo guardar tu progreso. Revisa la conexión.","info","err"));
        fs.collection("leaderboard").doc(u.uid).set({name:USER.name, xp:p.xp, streak:p.streak, nexo:clean(p.nexo), league:p.league||0, week:p.week||weekKey(), weekXp:p.weekXp||0, prev:p.prev?clean(p.prev):null, updated:Date.now()},{merge:true}).catch(e=>console.error("liga",e));
      }, 1200);
      return true;
    },
    async listProjects(){
      const col = fs.collection("projects"), u = auth.currentUser;
      if(isAdmin()) return docs(await col.get());
      const pub = docs(await col.where("status","==","published").get());
      return u ? mergeById(pub, docs(await col.where("uid","==",u.uid).get())) : pub;
    },
    async addProject(p){ return (await fs.collection("projects").add(clean(p))).id; },
    async updateProject(id,patch){ await fs.collection("projects").doc(id).update(clean(patch)); },
    async deleteProject(id){ await fs.collection("projects").doc(id).delete(); },
    async addFile(f, onProg){
      if(!f.file) throw new Error("Vuelve a elegir el archivo");
      const bytes = new Uint8Array(await f.file.arrayBuffer());
      const parts = Math.max(1, Math.ceil(bytes.length/CHUNK));
      const ref = await fs.collection("files").add({name:f.name, type:f.type||"", size:f.size, parts, bin:true, uid:auth.currentUser.uid, created:Date.now()});
      let next = 0, done = 0;
      const worker = async () => { while(next < parts){ const i = next++;
        await ref.collection("parts").doc(String(i)).set({d: firebase.firestore.Blob.fromUint8Array(bytes.subarray(i*CHUNK, (i+1)*CHUNK))});
        done++; if(onProg) onProg(done/parts); } };
      try{ await Promise.all(Array.from({length:Math.min(UPLOAD_PARALLEL, parts)}, worker)); }
      catch(e){ ref.delete().catch(()=>{}); throw e; }
      return ref.id; },
    async getFile(id){
      const ref = fs.collection("files").doc(id), meta = await ref.get(); if(!meta.exists) return null;
      const m = meta.data(), chunks = await Promise.all(Array.from({length:m.parts},(_,i)=>ref.collection("parts").doc(String(i)).get()));
      if(m.bin) return {name:m.name, type:m.type, size:m.size, blob:new Blob(chunks.map(c=>c.exists?c.data().d.toUint8Array():new Uint8Array(0)), {type:m.type||"application/octet-stream"})};
      return {name:m.name, type:m.type, size:m.size, data:chunks.map(c=>c.exists?c.data().d:"").join("")}; },
    async deleteFile(id){ const ref=fs.collection("files").doc(id); const m=await ref.get(); if(m.exists){ for(let i=0;i<(m.data().parts||1);i++) await ref.collection("parts").doc(String(i)).delete().catch(()=>{}); await ref.delete(); } },
    async listIdeas(){
      const col = fs.collection("ideas"), u = auth.currentUser;
      if(isAdmin()) return docs(await col.get());
      const pub = docs(await col.where("status","in",["accepted","added"]).get());
      return u ? mergeById(pub, docs(await col.where("uid","==",u.uid).get())) : pub;
    },
    async addIdea(i){ return (await fs.collection("ideas").add(clean(i))).id; },
    async updateIdea(id,patch){ await fs.collection("ideas").doc(id).update(clean(patch)); },
    async deleteIdea(id){ await fs.collection("ideas").doc(id).delete(); },
    async listLessons(){ const col=fs.collection("lessons"); return docs(isAdmin() ? await col.get() : await col.where("status","==","published").get()); },
    async addLesson(l){ return (await fs.collection("lessons").add(clean(l))).id; },
    async updateLesson(id,patch){ await fs.collection("lessons").doc(id).update(clean(patch)); },
    async deleteLesson(id){ await fs.collection("lessons").doc(id).delete(); },
    async vote(coll,id,on){ const uid=auth.currentUser.uid; await fs.collection(coll).doc(id).update({likedBy: on?FV.arrayUnion(uid):FV.arrayRemove(uid), likes: FV.increment(on?1:-1)}); },
    async leaderboard(){ return docs(await fs.collection("leaderboard").limit(1000).get()); },
    async listUsers(){ const us = docs(await fs.collection("users").get()); return us.map(u=>({id:u.id, name:u.name, email:u.email||"", created:u.created||0, xp:(u.progress&&u.progress.xp)||0, league:(u.progress&&u.progress.league)||0, lessons:u.progress&&u.progress.done?Object.keys(u.progress.done).length:0})); },
    async diag(){
      const out = [], uid = auth.currentUser && auth.currentUser.uid;
      const t = async (name, fn) => { try{ await fn(); out.push([name,true,""]); }catch(e){ out.push([name,false,(e.code||"")+" "+(e.message||"")]); } };
      await t("Leer proyectos", ()=>fs.collection("projects").limit(1).get());
      await t("Guardar tu progreso", ()=>fs.collection("users").doc(uid).set({diag:Date.now()},{merge:true}));
      await t("Aparecer en la liga", ()=>fs.collection("leaderboard").doc(uid).set({name:USER.name, updated:Date.now()},{merge:true}));
      await t("Ver la lista de cuentas (admin)", ()=>fs.collection("users").limit(1).get());
      await t("Publicar un proyecto", async()=>{ const r = await fs.collection("projects").add({title:"Prueba de conexión", uid, status:"pending", created:Date.now()}); await r.delete(); });
      await t("Enviar una idea", async()=>{ const r = await fs.collection("ideas").add({title:"Prueba", uid, status:"pending", created:Date.now()}); await r.delete(); });
      await t("Subir un archivo de prueba", async()=>{ const ref = await fs.collection("files").add({name:"prueba.txt", type:"text/plain", size:5, parts:1, bin:true, uid, created:Date.now()});
        await ref.collection("parts").doc("0").set({d:firebase.firestore.Blob.fromUint8Array(new Uint8Array([104,111,108,97,33]))});
        const back = await ref.collection("parts").doc("0").get(); if(!back.exists) throw new Error("no se pudo leer");
        await ref.collection("parts").doc("0").delete(); await ref.delete(); });
      return out; },
    async seedExamples(){ for(const p of SEED){ const {id, ...rest} = p; await fs.collection("projects").doc(id).set(clean({...rest, uid:auth.currentUser.uid})); } }
  };
}

/* ---------- Carga de datos ---------- */
async function refreshData(which=["projects","ideas","lessons"]){
  RULES_BAD = false;
  try{
    const jobs = which.map(async k=>{
      if(k==="projects") CACHE.projects = (await DB.listProjects()).map(p=>({images:[], likedBy:[], likes:0, ...p}));
      if(k==="ideas") CACHE.ideas = (await DB.listIdeas()).map(p=>({likedBy:[], likes:0, ...p}));
      if(k==="lessons") CACHE.lessons = await DB.listLessons();
      if(k==="board") CACHE.board = await DB.leaderboard();
    });
    await Promise.all(jobs);
  }catch(e){ console.error(e);
    if(e && e.code==="permission-denied"){ RULES_BAD = true; if(view!=="admin") toast("Firebase bloquea el acceso: falta publicar las reglas de NEXOR.","info","err"); }
    else toast("No se pudieron cargar algunos datos. Revisa la conexión.","info","err"); }
}
async function onUser(u){
  const guest = fillProgress(lsGet(GUEST_KEY) || migrateV2());
  USER = u;
  if(u){
    let p = await DB.loadProgress();
    if(!p || (p.xp===0 && guest.xp>0)) p = guest;
    P = fillProgress(p); saveP();
  } else P = guest;
  regen();
  await refreshData(["projects","ideas","lessons","board"]);
  processWeek();
  if(document.readyState!=="loading") render();
  if(P.leagueResult) showLeagueResult();
}
function migrateV2(){
  const v2 = lsGet("nexor_v2"); if(!v2) return null;
  const p = newProgress();
  ["xp","streak","lastDay","done","perfect","goal","ach"].forEach(k=>{ if(v2[k]!==undefined) p[k]=v2[k]; });
  p.build = v2.build || {}; return p;
}

   </section>`}
   <section class="card m-only"><h3 style="font-size:16px;margin-bottom:12px">Misiones de hoy</h3>${missionsHTML()}</section>`;
  R0.units.forEach((u,ui)=>{
    const ls = list.filter(l=>l.ui===ui), dn = ls.filter(l=>P.done[l.id]).length;
    h += `<section class="unit u-${u.color}" aria-label="Unidad ${u.num}"><div class="unit-banner"><div><span class="eyebrow">${route==="tecno"?"Tecnología · ":""}Unidad ${u.num}</span><h2>${u.title}</h2><p>${u.desc}</p></div><div class="unit-meter num">${dn}/${ls.length}<small>LECC.</small></div></div>${pathHTML(ls, idx, ui+(route==="tecno"?2:0), false, list)}</section>`;
  });
  const com = route==="ruta" ? communityLessons() : [];
  if(com.length){
    const dn = com.filter(l=>P.done[l.id]).length;
    h += `<section class="unit u-k"><div class="unit-banner"><div><span class="eyebrow">Unidad especial</span><h2>${COMMUNITY_UNIT.title}</h2><p>${communityOpen()?COMMUNITY_UNIT.desc:"Se desbloquea al completar 3 lecciones."}</p></div><div class="unit-meter num">${dn}/${com.length}<small>LECC.</small></div></div>${pathHTML(com, -1, UNITS.length, true)}</section>`;
  }
  return h + `</div>`;
}
function pathHTML(ls, idx, ui, community=false, list=OFFICIAL){
  const OFF=[0,58,86,58,0,-58,-86,-58], SP=118, TOP=100, CX=160;
  const pts = ls.map((l,i)=>({x:CX+OFF[(ui*3+i)%8], y:TOP+i*SP}));
  const H = TOP + (ls.length-1)*SP + 70;
  let traces="", vias="", nodes="";
  for(let i=0;i<ls.length-1;i++){
    const a=pts[i], b=pts[i+1], ad=Math.abs(b.x-a.x), m=a.y+(SP-ad)/2, lit=!!P.done[ls[i].id];
    traces += `<path class="trace ${lit?"lit":""}" d="M${a.x} ${a.y} V${m} L${b.x} ${m+ad} V${b.y}"/>`;
    if(ad) vias += `<circle class="via ${lit?"lit":""}" cx="${a.x}" cy="${m}" r="4"/><circle class="via ${lit?"lit":""}" cx="${b.x}" cy="${m+ad}" r="4"/>`;
  }
  let nexoAt = -1;
  ls.forEach((l,i)=>{
    const p = pts[i];
    let st;
    if(P.done[l.id]) st="done";
    else if(community) st = communityOpen() ? "open" : "locked";
    else st = list.indexOf(l)===idx ? "current" : "locked";
    if(st==="current") nexoAt=i;
    const right = p.x <= CX;
    nodes += `<button class="node ${st}" style="left:${p.x}px;top:${p.y}px" data-act="${st==="locked"?"locked":"start"}" data-id="${l.id}" aria-label="Lección ${lessonNum(l)}: ${esc(l.title)}${st==="done"?" (completada, repasar)":st==="locked"?" (bloqueada)":""}">
       ${st==="current"?`<span class="bubble">EMPEZAR</span>`:""}${st==="done"?I.check:st==="locked"?I.lock:I.star}</button>
     <div class="nlabel ${right?"r":"l"} ${st==="current"||st==="open"?"cur":""}" style="top:${p.y}px;${right?`left:${p.x+46}px`:`left:${p.x-158}px`}" aria-hidden="true"><small>${community&&l.by?`Idea de ${esc(l.by)}`:`Lección ${lessonNum(l)}`}</small>${esc(l.title)}</div>`;
  });
  return `<div class="path" style="height:${H}px"><svg class="traces" viewBox="0 0 320 ${H}" preserveAspectRatio="xMidYMin meet" aria-hidden="true">${traces}${vias}</svg>${nodes}</div>`;
}

/* ---------- Motor de lecciones ---------- */
let L = null;
const KIND = {learn:["Aprende","bulb"], mc:["Elige la respuesta","q"], tf:["¿Verdadero o falso?","q"], fill:["Completa la frase","q"], order:["Ordena los pasos","q"], match:["Une las parejas","q"], input:["Escribe la respuesta","edit"]};

function startLesson(id, opts={}){
  regen();
  const les = opts.lesson || findLesson(id); if(!les) return;
  const preview = !!opts.preview, practice = !!opts.practice, free = !!opts.free;
  if(!preview && !practice && !free && P.battery<=0){
    const mins = Math.max(1, Math.ceil((BAT_MS-(Date.now()-P.batTs))/60000));
    modal(`${nexo({mood:"sad"})}<h2>Batería agotada</h2><p>Recupera 1 carga en ${mins} min. También puedes hacer una práctica rápida (recarga 1) o comprar una recarga en la tienda.</p><div class="row-actions"><button class="btn grad" data-act="practice">${I.repeat}Práctica rápida</button><button class="btn ghost" data-act="nav" data-view="tienda">Ir a la tienda</button></div>`);
    return;
  }
  L = { les, queue: les.steps.map((s,i)=>({...s, _i:i})), total: les.steps.length, ok:0, mistakes:0, combo:0, best:0, correct:0,
        t0:Date.now(), replay: !!P.done[les.id], preview, practice, free, state:"answer" };
  closeModal();
  $("#lesson").hidden = false; document.body.style.overflow="hidden";
  renderLesson();
}
function startPractice(){
  const pool = [...OFFICIAL, ...TECH, ...communityLessons()].filter(l=>P.done[l.id]).flatMap(l=>l.steps.filter(s=>s.t!=="learn"));
  if(!pool.length){ toast("Completa al menos una lección para practicar.","info"); return; }
  const steps = shuffle(pool).slice(0,6);
  startLesson(null, {practice:true, lesson:{id:"practice", title:"Práctica rápida", steps, unit:{title:"Repaso"}}});
}
function closeLesson(){ $("#lesson").hidden = true; document.body.style.overflow=""; L=null; render(); }

function renderLesson(){
  const s = L.queue[0];
  L.state="answer"; L.sel=null; L.stepMistake=false;
  const pct = Math.round(L.ok / L.total * 100), kind = KIND[s.t] || KIND.mc;
  const head = `<div class="ls-kind">${I[kind[1]]}${kind[0]}</div>`;
  const ask = q => `<div class="q-row">${nexo({mood:"think"})}<div class="say">${esc(q)}</div></div>`;
  let body = "";
  if(s.t==="learn"){
    body = `${head}<div class="learn-card"><h2>${esc(s.h)}</h2>${s.p ? s.p : textHtml(s.text)}${s.fig?FIG[s.fig]:""}${s.code?`<pre class="codeblk"><code>${hl(s.code)}</code></pre>`:""}${s.tip?`<div class="tip">${I.info}<span>${s.tip}</span></div>`:""}</div>`;
  } else if(s.t==="mc"){
    L.order = shuffle(s.o.map((_,i)=>i));
    body = `${head}${ask(s.q)}<div class="opts" role="radiogroup">${L.order.map((oi,k)=>`<button class="opt" role="radio" aria-checked="false" data-act="pick" data-v="${oi}"><span class="k">${k+1}</span><span>${esc(s.o[oi])}</span></button>`).join("")}</div>`;
  } else if(s.t==="tf"){
    body = `${head}${ask(s.q)}<div class="tf opts" role="radiogroup"><button class="opt" role="radio" aria-checked="false" data-act="pick" data-v="1">Verdadero</button><button class="opt" role="radio" aria-checked="false" data-act="pick" data-v="0">Falso</button></div>`;
  } else if(s.t==="fill"){
    L.order = shuffle(s.o.map((_,i)=>i));
    const [a,b] = s.q.split("___");
    body = `${head}<div class="sentence">${esc(a)}<span class="blank empty" id="blank">______</span>${esc(b||"")}</div><div class="bank">${L.order.map(oi=>`<button class="tok" data-act="pick" data-v="${oi}">${esc(s.o[oi])}</button>`).join("")}</div>`;
  } else if(s.t==="order"){
    let o; do { o = shuffle(s.items.map((_,i)=>i)); } while(o.map(i=>s.items[i]).join("|")===s.items.join("|") && s.items.length>1);
    L.bank=o; L.ans=[];
    body = `${head}${ask(s.q)}<div class="answer-zone" id="ansZone"></div><div class="bank" id="bank"></div>`;
  } else if(s.t==="match"){
    L.left = shuffle(s.pairs.map((_,i)=>i)); L.right = shuffle(s.pairs.map((_,i)=>i)); L.mSel=null; L.matched=new Set();
    body = `${head}<h2 class="ls-q">${esc(s.q)}</h2><div class="match"><div class="col">${L.left.map(i=>`<button class="tok" data-act="mL" data-v="${i}">${esc(s.pairs[i][0])}</button>`).join("")}</div><div class="col">${L.right.map(i=>`<button class="tok" data-act="mR" data-v="${i}">${esc(s.pairs[i][1])}</button>`).join("")}</div></div>`;
  } else if(s.t==="input"){
    body = `${head}${ask(s.q)}<div class="typein"><label class="sr" for="ansInput">Tu respuesta</label><input class="input" id="ansInput" inputmode="decimal" autocomplete="off" placeholder="Escribe aquí">${s.unit?`<span>${esc(s.unit)}</span>`:""}</div>`;
  }
  $("#lesson").innerHTML = `
   <div class="ls-top"><button class="iconbtn" data-act="quitLesson" aria-label="Salir de la lección">${I.x}</button>
     <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
     ${L.combo>=3?`<span class="combo">Combo ×${L.combo}</span>`:""}
     ${L.practice||L.preview||L.free?`<span class="pill s-accepted">${L.preview?"Vista previa":L.free?"Prueba del capítulo":"Práctica"}</span>`:`<div class="stat bat ${P.battery<=1?"low":""}" style="flex:none">${battery(P.battery)}<span class="num">${P.battery}</span></div>`}</div>
   <div class="ls-body"><div class="ls-inner">${body}</div></div>
   <div class="ls-foot" id="lsFoot"><div class="ls-foot-in"><div class="fb" id="fb"></div>
     <button class="btn ${s.t==="learn"?"grad":""}" id="mainBtn" data-act="${s.t==="learn"?"next":"check"}" ${s.t==="learn"?"":"disabled"}>${s.t==="learn"?"Continuar":"Comprobar"}</button></div></div>`;
  if(s.t==="order") renderOrder();
  $(".ls-body").scrollTop=0;
  if(s.t==="input" && !isMobile()) $("#ansInput").focus(); else $("#mainBtn").focus({preventScroll:true});
}
function renderOrder(){
  const s=L.queue[0], cls = s.code ? "tok code" : "tok";
  $("#ansZone").innerHTML = L.ans.map((i,k)=>`<button class="${cls}" data-act="unpick" data-k="${k}"><b>${k+1}</b>${esc(s.items[i])}</button>`).join("");
  $("#bank").innerHTML = L.bank.map(i=>`<button class="${cls} ${L.ans.includes(i)?"used":""}" data-act="opick" data-v="${i}" ${L.ans.includes(i)?'tabindex="-1"':""}>${esc(s.items[i])}</button>`).join("");
  $("#mainBtn").disabled = L.ans.length !== s.items.length;
}
function pick(v){
  if(L.state!=="answer") return;
  const s=L.queue[0]; L.sel=+v; SFX.tap();
  $$('#lesson [data-act="pick"]').forEach(b=>{ const on=+b.dataset.v===L.sel; b.classList.toggle("sel",on); b.setAttribute("aria-checked",on); });
  if(s.t==="fill"){ const bl=$("#blank"); bl.textContent=s.o[L.sel]; bl.classList.remove("empty"); }
  $("#mainBtn").disabled=false;
}
function loseBattery(){ if(L.practice||L.preview||L.free) return; P.battery=Math.max(0,P.battery-1); saveP(); const el=$("#lesson .ls-top .stat"); if(el){ el.className=`stat bat ${P.battery<=1?"low":""}`; el.innerHTML=battery(P.battery)+`<span class="num">${P.battery}</span>`; } }
function matchPick(side, v){
  if(L.state!=="answer") return;
  v=+v; const s=L.queue[0];
  if(side==="L"){ if(L.matched.has(v)) return; L.mSel=v; SFX.tap(); $$('#lesson [data-act="mL"]').forEach(b=>b.classList.toggle("sel",+b.dataset.v===v)); return; }
  if(L.mSel===null || L.matched.has(v)) return;
  const lb=$(`#lesson [data-act="mL"][data-v="${L.mSel}"]`), rb=$(`#lesson [data-act="mR"][data-v="${v}"]`);
  if(L.mSel===v){
    L.matched.add(v); [lb,rb].forEach(b=>{ b.classList.remove("sel"); b.classList.add("matched"); b.disabled=true; }); L.mSel=null; SFX.tap();
    if(L.matched.size===s.pairs.length){ L.state="checked"; registerAnswer(!L.stepMistake); feedback(true, L.stepMistake?"Lo lograste. Repasa las parejas que fallaste.":"¡Todas las parejas son correctas!"); }
  } else {
    [lb,rb].forEach(b=>{ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }); buzz(80);
    if(!L.stepMistake){ L.stepMistake=true; L.mistakes++; L.combo=0; loseBattery(); }
  }
}
const norm = s => String(s).trim().toLowerCase().replace(/,/g,".").replace(/\s+/g," ");
function check(){
  const s=L.queue[0]; let ok=false, correctText="";
  if(s.t==="mc"||s.t==="fill"){ ok = L.sel===s.a; correctText = s.o[s.a]; }
  else if(s.t==="tf"){ ok = (L.sel===1)===s.a; correctText = s.a?"Verdadero":"Falso"; }
  else if(s.t==="order"){ ok = L.ans.map(i=>s.items[i]).join("|")===s.items.join("|"); correctText = s.items.map((x,i)=>`${i+1}. ${x}`).join("  "); }
  else if(s.t==="input"){ const v=norm($("#ansInput").value); ok = s.a.some(w=>norm(w)===v || (!isNaN(parseFloat(w)) && parseFloat(v)===parseFloat(norm(w)))); correctText = s.a[0]+(s.unit?" "+s.unit:""); $("#ansInput").disabled=true; }
  L.state="checked";
  $$('#lesson [data-act="pick"],#lesson [data-act="opick"],#lesson [data-act="unpick"]').forEach(b=>b.disabled=true);
  if(s.t==="mc"||s.t==="tf"){
    $$('#lesson [data-act="pick"]').forEach(b=>{ const v=+b.dataset.v, right = s.t==="tf" ? ((v===1)===s.a) : v===s.a; if(right) b.classList.add("good"); else if(v===L.sel) b.classList.add("wrong"); b.classList.remove("sel"); });
  }
  if(ok){ registerAnswer(true); feedback(true, s.ex); }
  else { L.mistakes++; L.combo=0; loseBattery(); feedback(false, s.ex, correctText); }
}
function registerAnswer(clean){
  L.ok++; L.correct++; if(!L.preview) P.daily.correct++;
  if(clean){ L.combo++; L.best=Math.max(L.best,L.combo); }
}
const PRAISE = ["¡Correcto!","¡Muy bien!","¡Exacto!","¡Así se hace!","¡Perfecto!","¡Genial!"];
function feedback(ok, ex, correct){
  $("#lsFoot").className = "ls-foot "+(ok?"ok":"bad");
  if(ok){ SFX.ok(); buzz(30); } else { SFX.bad(); buzz([60,40,60]); }
  const comboTxt = ok && L.combo>=3 ? ` · Combo ×${L.combo}` : "";
  $("#fb").innerHTML = `<div class="ico">${ok?I.check:I.x}</div><div><h3>${ok?pickOne(PRAISE)+comboTxt:"Respuesta correcta:"}</h3>${!ok&&correct?`<p><strong>${esc(correct)}</strong></p>`:""}${ex?`<p>${esc(ex)}</p>`:""}</div>`;
  const b=$("#mainBtn"); b.disabled=false; b.dataset.act="next"; b.className="btn "+(ok?"ok":"bad"); b.textContent="Continuar"; b.focus({preventScroll:true});
  L.lastOk = ok;
}
function next(){
  const s = L.queue.shift();
  if(s.t==="learn") L.ok++;
  else if(L.state==="checked" && !L.lastOk) L.queue.push(s);
  if(!L.practice && !L.preview && !L.free && P.battery<=0 && L.queue.length) return failLesson();
  if(!L.queue.length) return finishLesson();
  renderLesson();
}
function failLesson(){
  saveP();
  $("#lesson").innerHTML = `<div class="ls-body"><div class="ls-inner done-screen">${nexo({mood:"sad"})}<h2 style="background:none;color:var(--bad)">Batería agotada</h2><p class="muted">Cada respuesta incorrecta gasta una carga. Recuperas 1 cada 15 minutos, o haciendo una práctica rápida.<br>Tus lecciones anteriores siguen guardadas.</p><div class="row-actions" style="justify-content:center"><button class="btn grad" data-act="practice">${I.repeat}Práctica rápida</button><button class="btn ghost" data-act="closeLesson">Volver a la ruta</button></div></div></div>`;
}
function finishLesson(){
  const secs = Math.round((Date.now()-L.t0)/1000), perfect = L.mistakes===0;
  const qs = L.les.steps.filter(s=>s.t!=="learn").length;
  const acc = qs ? Math.round(qs/(qs+L.mistakes)*100) : 100;
  if(L.preview){
    $("#lesson").innerHTML = `<div class="ls-body"><div class="ls-inner done-screen">${nexo({mood:"dance"})}<h2>Vista previa terminada</h2><p class="muted">Así la verá todo el mundo. No se sumó XP.</p><button class="btn grad" data-act="closeLesson">Volver al panel</button></div></div>`;
    return;
  }
  let gain, coins;
  if(L.practice){ gain = 5 + (perfect?3:0); coins = 3; P.practices++; P.battery = Math.min(5, P.battery+1); }
  else { gain = L.replay ? 5 : 10 + (perfect?5:0); coins = L.replay ? 2 : 5 + (perfect?5:0); }
  gainXP(gain); P.daily.lessons++; P.coins += coins;
  P.bestCombo = Math.max(P.bestCombo, L.best);
  const t = today();
  if(P.lastDay!==t){
    const d = P.lastDay ? dayDiff(P.lastDay,t) : 99;
    if(d===1) P.streak++;
    else if(d===2 && P.freeze>0){ P.freeze--; P.streak++; toast("Tu protector de racha salvó tu racha","snow"); }
    else P.streak = 1;
    P.lastDay = t;
  }
  let unitBonus = 0, unitNow = false, chapterNow = false;
  if(L.les.chapter!==undefined){ P.read=P.read||{}; if(!P.read[L.les.chapter]){ P.read[L.les.chapter]=true; chapterNow=true; } }
  if(!L.practice){
    if(!P.done[L.les.id]) P.done[L.les.id] = {at:Date.now()};
    if(perfect) P.perfect++;
    const u = L.les.unit;
    if(u.lessons && unitDone(u) && !P.unitsRewarded.includes(u.id)){ P.unitsRewarded.push(u.id); unitBonus=20; P.coins+=20; unitNow=true; }
  }
  P.tipIdx = (P.tipIdx||0)+1;
  saveP(); SFX.win(); buzz([40,60,40]);
  const title = chapterNow ? "¡Capítulo aprobado!" : L.practice ? (perfect?"¡Práctica perfecta!":"¡Práctica completa!") : unitNow ? "¡Unidad completa!" : perfect ? "¡Lección perfecta!" : "¡Lección completada!";
  $("#lesson").innerHTML = `<div class="ls-body"><div class="ls-inner done-screen">
     ${nexo({mood:"dance", label:"Nexo celebrando"})}
     <h2>${title}</h2>
     <p class="muted">${esc(L.les.title)}${L.replay&&!L.practice?" · repaso":""}${L.practice?" · +1 carga de batería":""}${unitBonus?` · bonus de unidad +${unitBonus} tornillos`:""}</p>
     <div class="tiles">
       <div class="tile t1"><span>XP</span><b class="num">+${gain}</b></div>
       <div class="tile t4"><span>Tornillos</span><b class="num">+${coins+unitBonus}</b></div>
       <div class="tile t2"><span>Precisión</span><b class="num">${acc}%</b></div>
       <div class="tile t3"><span>Tiempo</span><b class="num">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b></div>
     </div>
     <p class="small muted">Racha: ${P.streak} ${P.streak===1?"día":"días"} · Mejor combo: ${L.best} · Meta de hoy: ${Math.min(P.daily.xp,P.goal)}/${P.goal} XP</p>
     ${L.les.chapter!==undefined && L.les.chapter<3 ? `<div class="row-actions" style="justify-content:center"><button class="btn grad" data-act="nextChapter" data-v="${L.les.chapter+1}">Siguiente capítulo</button><button class="btn ghost" data-act="closeLesson">Volver al capítulo</button></div>`
       : L.les.chapter===3 ? `<div class="row-actions" style="justify-content:center"><button class="btn grad" data-act="nextChapter" data-v="jugar">Ir a Aprende jugando</button><button class="btn ghost" data-act="closeLesson">Volver al capítulo</button></div>`
       : `<button class="btn grad" data-act="closeLesson" style="min-width:220px">Continuar</button>`}
   </div></div>`;
  checkAch();
}
