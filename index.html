const lines = s => String(s||"").split("\n").map(x=>x.replace(/^\s*(\d+[.)]|[-•*])\s*/,"").trim()).filter(Boolean);
function toProject(d){
  return { kind:d.kind, title:d.title.trim()||"Mi proyecto", author:d.author.trim()||USER?.name||"Anónimo", uid:USER?.uid||"", category:d.category, difficulty:d.difficulty, time:d.time.trim(),
    images:d.images.slice(0,4), summary:d.summary.trim()||"Descripción de tu proyecto.", materials:lines(d.materials), steps:lines(d.steps), code:(d.code||"").replace(/\s+$/,""),
    demo:safeUrl(d.demo), links:d.links.slice(0,6), files:d.files.map(f=>({id:f.id||"", name:f.name, size:f.size, type:f.type||""})), likes:0, likedBy:[], created:Date.now(), status:"pending", note:"", pinned:false };
}
function addDraftLink(){
  const d=W.d, url=safeUrl(d.linkUrl);
  if(!url){ W.errors={linkUrl:"Pega un enlace completo que empiece con https://"}; return render(); }
  if(d.links.some(l=>l.url===url)){ W.errors={linkUrl:"Ese enlace ya está en la lista."}; return render(); }
  d.links.push({url, title:d.linkTitle.trim().slice(0,60), type:linkType(url)}); d.linkUrl=""; d.linkTitle=""; W.errors={}; SFX.tap(); render();
}
function validate(){
  const d=W.d, e={};
  if(W.step===1){ if(d.title.trim().length<4) e.title="Escribe un nombre de al menos 4 letras."; if(!d.author.trim()) e.author="Escribe tu nombre o un apodo.";
    if(d.images.join("").length > 640000) e.images="Las imágenes ocupan mucho. Quita alguna."; }
  if(W.step===2){ if(d.summary.trim().length<15) e.summary="Cuéntanos un poco más (al menos 15 caracteres).";
    if(lines(d.materials).length<1) e.materials=`Escribe al menos una línea en “${KLABELS[d.kind].mat}”.`;
    if(lines(d.steps).length<(d.kind==="fisico"?2:1)) e.steps = d.kind==="fisico" ? "Agrega al menos dos pasos, uno por línea." : `Escribe al menos una línea en “${KLABELS[d.kind].steps}”.`;
    if(d.demo.trim() && !safeUrl(d.demo)) e.demo="El enlace debe empezar con https://"; }
  if(W.step===3){
    if(d.linkUrl.trim()){ const url=safeUrl(d.linkUrl); if(url && !d.links.some(l=>l.url===url)){ d.links.push({url, title:d.linkTitle.trim().slice(0,60), type:linkType(url)}); d.linkUrl=""; d.linkTitle=""; } else if(!url) e.linkUrl="Pega un enlace completo que empiece con https:// o borra el campo."; }
    if(d.kind==="investigacion" && !d.links.length && !d.files.length) e.links="Sube tu presentación o documento, o agrega al menos un enlace.";
    if(d.kind==="digital" && !d.links.length && !d.files.length && !safeUrl(d.demo)) e.links="Agrega el enlace para probarlo (paso anterior), un video o un archivo."; }
  if(W.step===4 && !d.editId){ if(d.ideaTitle.trim().length<4) e.ideaTitle="Ponle un título a tu idea."; if(d.ideaDesc.trim().length<15) e.ideaDesc="Explica tu idea un poco más (al menos 15 caracteres)."; }
  W.errors=e; return !Object.keys(e).length;
}
async function submitStep(){
  if(!validate()){ render(); const first=$(".input.err")||$(".errmsg"); if(first) (first.focus?first.focus():null); return; }
  if(W.step<4){ W.step++; render(); window.scrollTo({top:0}); return; }
  const btn=$("#sendBtn"); if(btn){ btn.disabled=true; btn.textContent="Enviando…"; }
  const d=W.d, p=toProject(d);
  try{
    const pend = d.files.filter(f=>!f.id), total = pend.reduce((n,f)=>n+f.size,0) || 1; let sent = 0;
    for(const f of pend){
      try{ f.id = await DB.addFile(f, r=>{ if(btn) btn.textContent = `Subiendo archivos… ${Math.min(99,Math.round((sent + f.size*r)/total*100))}%`; }); }
      catch(err){ console.error("Error al subir", f.name, err); err.fileName = f.name; throw err; }
      sent += f.size;
    }
    p.files = d.files.map(f=>({id:f.id, name:f.name, size:f.size, type:f.type||""}));
    if(btn) btn.textContent="Enviando…";
    if(d.editId){ const {likes, likedBy, created, uid, pinned, ...patch} = p; await DB.updateProject(d.editId, {...patch, status:"pending", note:""}); }
    else {
      let pid;
      try{ pid = await DB.addProject(p); }catch(err){ err.step="guardar el proyecto"; throw err; }
      try{ await DB.addIdea({title:d.ideaTitle.trim(), type:d.ideaType, desc:d.ideaDesc.trim(), author:p.author, uid:USER.uid, status:"pending", likes:0, likedBy:[], created:Date.now(), projectId:pid, projectTitle:p.title, note:""}); }catch(err){ err.step="guardar tu idea"; throw err; }
    }
    W=null; await refreshData(["projects","ideas"]);
    toast("¡Enviado! Un administrador lo revisará.","send"); SFX.win();
    checkAch(); projTab="mios"; go("proyectos");
  }catch(err){
    const perm = err && err.code==="permission-denied";
    const what = err && err.fileName ? `subir “${err.fileName}”` : (err && err.step) || "enviar el proyecto";
    const msg = perm ? "" : (err && err.fileName ? fileErrMsg(err) : errMsg(err));
    modal(`${nexo({mood:"sad"})}<h2>No se pudo ${esc(what)}</h2>${perm?rulesHelp():`<p>${esc(msg)}</p>`}<p class="small muted">Tu proyecto no se perdió: sigue en el formulario. Código del error: ${esc((err&&err.code)||"desconocido")}</p><button class="btn grad" data-act="closeModal">Entendido</button>`, "wide-text");
    if(btn){ btn.disabled=false; btn.textContent="Enviar a revisión"; }
  }
}
function rulesHelp(){
  return `<p>Firebase bloqueó el guardado: <b>las reglas de seguridad de NEXOR no están publicadas</b> en la base de datos. Lo arregla un administrador en 1 minuto:</p>
  <ol class="fixlist"><li>Entra a <b>console.firebase.google.com</b> y abre el proyecto.</li><li>En el menú: <b>Firestore Database</b> (no Storage ni Realtime Database).</li><li>Arriba, pestaña <b>Reglas</b>. Borra todo lo que haya.</li><li>Pega el archivo <b>firestore.rules</b> completo y toca <b>Publicar</b>.</li><li>Espera 1 minuto y vuelve a tocar “Enviar a revisión”.</li></ol>`;
}
let RULES_BAD = false;
function fileErrMsg(err){
  const c = err && err.code || "";
  if(c==="permission-denied") return "Firebase no tiene permiso para guardar archivos: un administrador tiene que pegar las reglas nuevas (firestore.rules) en Firestore → Reglas → Publicar.";
  if(c==="resource-exhausted") return "Se llegó al límite gratuito de Firebase por hoy. Prueba mañana o sube el archivo a Drive y pega el enlace.";
  if(c==="unauthenticated") return "Tu sesión se cerró. Vuelve a ingresar y prueba de nuevo.";
  if(c==="unavailable"||c==="deadline-exceeded"||c==="auth/network-request-failed") return "Se cortó la conexión. Revisa el internet y vuelve a intentar.";
  return (err && err.message ? err.message+". " : "") + "Vuelve a intentarlo o súbelo a Drive y pega el enlace.";
}
function compressImage(file, max=900, q=.72){
  return new Promise((res,rej)=>{
    if(!file.type.startsWith("image/")) return rej(new Error("Ese archivo no es una imagen. Los PowerPoint, Word y PDF se suben en el paso 3, “Archivos y videos”."));
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const draw = m => { const s=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); return c; };
      let c=draw(max), out=c.toDataURL("image/jpeg",q);
      if(out.length>150000) out=c.toDataURL("image/jpeg",.55);
      if(out.length>150000){ c=draw(700); out=c.toDataURL("image/jpeg",.5); }
      if(out.length>150000){ c=draw(520); out=c.toDataURL("image/jpeg",.5); }
      res(out); };
      img.onerror=()=>rej(new Error("No se pudo leer la imagen. Prueba con una foto JPG o PNG.")); img.src=fr.result; };
    fr.onerror=()=>rej(new Error("No se pudo leer el archivo.")); fr.readAsDataURL(file);
  });
}
async function handleDocs(list){
  if(!W) return;
  for(const f of Array.from(list)){
    if(W.d.files.length>=FILE_COUNT){ toast(`Máximo ${FILE_COUNT} archivos por proyecto.`,"info"); break; }
    const x = extOf(f.name), t = (f.type||"").toLowerCase();
    if(t.startsWith("image/") || ["jpg","jpeg","png","gif","webp","heic","heif","bmp"].includes(x)){ toast("Las imágenes van en el paso 1, en “Fotos”.","info"); continue; }
    if(t.startsWith("video/") || ["mp4","mov","avi","mkv","webm","3gp","wmv"].includes(x)){ toast("Los videos son muy pesados: súbelos a YouTube o Drive y pega el enlace.","info","err"); continue; }
    if(["exe","apk","bat","cmd","msi","sh","js","jar","scr","com","vbs"].includes(x)){ toast("Ese tipo de archivo no se puede subir por seguridad.","info","err"); continue; }
    if(W.d.files.some(o=>o.name===f.name && o.size===f.size)){ toast(`“${f.name}” ya está en la lista.`,"info"); continue; }
    if(f.size>FILE_MAX){ toast(`“${f.name}” pesa ${fmtSize(f.size)} y el máximo es ${fmtSize(FILE_MAX)}. Prueba guardarlo como PDF o comprimir sus imágenes, o súbelo a Drive y pega el enlace.`,"info","err"); continue; }
    if(f.size===0){ toast(`“${f.name}” está vacío.`,"info","err"); continue; }
    W.d.files.push({name:f.name, size:f.size, type:f.type, file:f});
  }
  W.errors={}; render();
}
async function handleFiles(files){
  if(!W) return;
  const room = 4 - W.d.images.length;
  const list = Array.from(files).slice(0, room);
  if(files.length>room) toast("Máximo 4 imágenes por proyecto.","info");
  for(const f of list){ try{ W.d.images.push(await compressImage(f)); }catch(e){ toast(e.message,"info","err"); } }
  render();
}

function shopItem(s){

  } else {
    const look = Object.assign({color:P.nexo.color}, {[slot]:s.v});

function glossaryList(){

const GOOGLE_G = '<svg class="gg" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>';
const waitFor = (fn, ms=4000) => new Promise(res=>{ const t0=Date.now(); (function loop(){ if(fn()||Date.now()-t0>ms) return res(); setTimeout(loop,100); })(); });
async function googleAuth(){
  AUTH.busy=true; AUTH.errors={}; render();
  try{
    await DB.google(); await waitFor(()=>USER);
    AUTH.busy=false;
    if(USER){ toast(`¡Hola, ${USER.name.split(" ")[0]}!`,"user"); go(isAdmin() ? "admin" : "inicio"); } else render();
  }catch(err){ AUTH.busy=false; if(err && (err.code==="auth/popup-closed-by-user"||err.code==="auth/cancelled-popup-request")) return render(); AUTH.errors={form:errMsg(err)}; if(view!=="cuenta") go("cuenta"); else render(); }
}
async function submitAuth(){
  const a=AUTH, v=a.vals, e={}; const email=v.email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email="Escribe un correo válido.";
  if(a.tab==="crear"){ if(v.name.trim().length<2) e.name="Escribe un nombre o apodo (mínimo 2 letras)."; }
  if(a.tab!=="olvido" && v.pass.length<6) e.pass="La contraseña debe tener al menos 6 caracteres.";
  a.errors=e; if(Object.keys(e).length) return render();
  a.busy=true; render();
  try{
    if(a.tab==="crear") await DB.register({email, pass:v.pass, name:v.name.trim()});
    else if(a.tab==="entrar") await DB.login(email, v.pass);
    else { await DB.reset(email); a.busy=false; toast("Te enviamos un correo para cambiar la contraseña.","mail"); a.tab="entrar"; return render(); }
    const wasCreate = a.tab==="crear";
    AUTH = {tab:"entrar", errors:{}, busy:false, showPw:false, vals:{name:"",email:"",pass:""}};
    toast(wasCreate ? (DB.mode==="firebase"?"¡Cuenta creada! Te enviamos un correo para verificarla.":"¡Cuenta creada!") : "¡Bienvenido/a de vuelta!", "user");
    go(isAdmin()||adminPendingVerify() ? "admin" : "inicio");
  }catch(err){ a.busy=false; a.errors={form:errMsg(err)}; render(); }
}

const PROMOTE = 3; // cuántos suben cada semana
function weekKey(d=new Date()){ const m=new Date(d.getFullYear(), d.getMonth(), d.getDate()-((d.getDay()+6)%7)); return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,"0")}-${String(m.getDate()).padStart(2,"0")}`; }
function weekLeft(){ const [y,m,d]=weekKey().split("-").map(Number); const end=new Date(y,m-1,d+7); const ms=end-new Date(); const days=Math.floor(ms/864e5), hrs=Math.floor(ms/36e5)%24; return days>0?`${days} ${days===1?"día":"días"} y ${hrs} h`:`${hrs} h`; }
let lbN=0;

function gainXP(n){ processWeek(); P.xp+=n; P.daily.xp+=n; P.weekXp=(P.weekXp||0)+n; }
function myLeagueGroup(){
  const wk=weekKey(), me = USER ? {id:USER.uid, name:USER.name, nexo:P.nexo, weekXp:P.weekXp||0, me:true} : null;
  const others = CACHE.board.filter(r=>(!USER || r.id!==USER.uid) && (r.league||0)===(P.league||0));
  const list = others.map(r=>({id:r.id, name:r.name||"Explorador/a", nexo:r.nexo, weekXp:r.week===wk ? (r.weekXp||0) : 0}));
  if(me) list.push(me);
  return list.sort((x,y)=>y.weekXp-x.weekXp);
}
function processWeek(){
  const wk=weekKey(); if(!P || P.week===wk) return;
  const old={week:P.week, league:P.league||0, xp:P.weekXp||0};
  let res=null;
  if(old.week && USER){
    if(old.xp>0){
      const scores = CACHE.board.filter(r=>r.id!==USER.uid).map(r=>
        (r.week===old.week && (r.league||0)===old.league) ? (r.weekXp||0)
        : (r.prev && r.prev.week===old.week && r.prev.league===old.league) ? r.prev.xp : 0).filter(x=>x>0);
      const pos = 1 + scores.filter(x=>x>old.xp).length;
      const up = pos<=PROMOTE && old.league<LEAGUES.length-1;
      res = {pos, n:scores.length+1, xp:old.xp, from:old.league, to:up?old.league+1:old.league, kind:up?"up":"stay"};
    } else if(old.league>0) res = {pos:null, n:null, xp:0, from:old.league, to:old.league-1, kind:"down"};
    if(res){ P.league=res.to; if(res.kind==="up"){ res.coins=20+10*res.to; P.coins+=res.coins; } P.leagueResult=res; }
  }
  P.prev = old.week ? old : null; P.week=wk; P.weekXp=0;
  saveP();
}
function showLeagueResult(){
  const r=P.leagueResult; if(!r) return; P.leagueResult=null; saveP();
  const L=LEAGUES[r.to];
  const title = r.kind==="up" ? `¡Subiste a la ${L.name}!` : r.kind==="down" ? `Bajaste a la ${L.name}` : `Sigues en la ${L.name}`;
  const txt = r.kind==="up" ? `Terminaste la semana en el puesto ${r.pos} con ${r.xp} XP. Ganaste ${r.coins} tornillos.`
    : r.kind==="down" ? "La semana pasada no ganaste XP. ¡Esta semana puedes volver a subir!"
    : `Terminaste en el puesto ${r.pos} de ${r.n} con ${r.xp} XP. Llega al top ${PROMOTE} para subir.`;
  modal(`<div style="width:110px">${leagueBadge(r.to)}</div>${nexo({mood:r.kind==="down"?"sad":r.kind==="up"?"dance":"happy"})}<h2>${title}</h2><p>${txt}</p><button class="btn grad" data-act="closeModal">¡Vamos!</button>`);
  if(r.kind==="up") SFX.win();
}

/* ----- Juego 1: Circuito completo ----- */
const DR=[-1,0,1,0], DC=[0,1,0,-1], BIT=[1,2,4,8]; // N E S W
const rot = m => ((m<<1)|(m>>3))&15;
function genCircuit(level){
  const n = Math.min(6, 3+Math.ceil(level/2));
  const sr=Math.floor(Math.random()*n), er=Math.floor(Math.random()*n);
  let path=null, steps=0;
  const vis=new Set([sr*n]);
  (function dfs(r,c,acc){
    if(path || ++steps>4000) return;
    if(r===er && c===n-1){ path=acc.slice(); return; }
    for(const d of shuffle([0,1,2,3])){ const nr=r+DR[d], nc=c+DC[d], k=nr*n+nc;
      if(nr<0||nc<0||nr>=n||nc>=n||vis.has(k)) continue;
      vis.add(k); acc.push([nr,nc]); dfs(nr,nc,acc); if(path) return; acc.pop(); vis.delete(k); }
  })(sr,0,[[sr,0]]);
  if(!path){ path=[]; for(let c=0;c<n;c++) path.push([sr,c]); const s=sr<er?1:-1; for(let r=sr+s; s>0?r<=er:r>=er; r+=s) path.push([r,n-1]); }
  const grid=Array(n*n).fill(null).map(()=>({m:pickOne([5,5,3,3,7,0])}));
  const dirTo=(a,b)=>{ for(let d=0;d<4;d++) if(a[0]+DR[d]===b[0]&&a[1]+DC[d]===b[1]) return d; };
  path.forEach((p,i)=>{ let m=0; m |= i===0 ? 8 : BIT[dirTo(p,path[i-1])]; m |= i===path.length-1 ? 2 : BIT[dirTo(p,path[i+1])]; grid[p[0]*n+p[1]].m=m; });
  const sol=grid.map(t=>t.m);
  grid.forEach(t=>{ let k=Math.floor(Math.random()*4); while(k--) t.m=rot(t.m); });
  const C={n, sr, er, grid, sol, moves:0, level};
  if(circuitLit(C).solved) grid[path[0][0]*n+path[0][1]].m = rot(grid[path[0][0]*n+path[0][1]].m);
  return C;
}
function circuitLit(C){
  const {n,sr,er,grid}=C, lit=new Set();
  if(!(grid[sr*n].m & 8)) return {lit, solved:false};
  const q=[[sr,0]]; lit.add(sr*n);
  while(q.length){ const [r,c]=q.shift(), m=grid[r*n+c].m;
    for(let d=0;d<4;d++){ if(!(m&BIT[d])) continue; const nr=r+DR[d], nc=c+DC[d]; if(nr<0||nc<0||nr>=n||nc>=n) continue; const k=nr*n+nc;
      if(lit.has(k) || !(grid[k].m & BIT[(d+2)%4])) continue; lit.add(k); q.push([nr,nc]); } }
  return {lit, solved: lit.has(er*n+n-1) && !!(grid[er*n+n-1].m & 2)};
}
function tileSVG(m, on){
  const col = on ? "#22d3ee" : "#4b5794", ends={1:"50,0",2:"100,50",4:"50,100",8:"0,50"};
  let s=`<svg viewBox="0 0 100 100" aria-hidden="true">`;
  [1,2,4,8].forEach(b=>{ if(m&b) s+=`<line x1="50" y1="50" x2="${ends[b].split(",")[0]}" y2="${ends[b].split(",")[1]}" stroke="${col}" stroke-width="16" stroke-linecap="${m===b?"round":"butt"}"/>`; });
  if(m) s+=`<circle cx="50" cy="50" r="${m===5||m===10?8:11}" fill="${col}"/>`;
  return s+`</svg>`;
}
function circuitStart(){ const s=gp("circuit"); G.C=genCircuit(s.level||1); circuitRender(); }
function circuitRender(){
  const C=G.C, {lit, solved}=circuitLit(C), n=C.n;
  let cells="";
  for(let r=0;r<n;r++){
    cells += `<div class="cside">${r===C.sr?`<div class="cbat" title="Batería">${I.battery}</div>`:""}</div>`;
    for(let c=0;c<n;c++){ const k=r*n+c; cells += `<button class="ctile ${lit.has(k)?"on":""}" data-act="cRot" data-v="${k}" aria-label="Pieza fila ${r+1} columna ${c+1}" ${solved?"disabled":""}>${tileSVG(C.grid[k].m, lit.has(k))}</button>`; }
    cells += `<div class="cside">${r===C.er?`<div class="cled ${solved?"on":""}" title="LED"></div>`:""}</div>`;
  }
  const s=gp("circuit");
  const body = solved && G.reward ? gameWin("¡Circuito cerrado!","El LED se encendió porque la corriente encontró un camino completo de ida y vuelta.", G.reward, `<button class="btn grad" data-act="cNext">Siguiente nivel</button><button class="btn ghost" data-act="gClose">Salir</button>`) + `<div class="cboard" style="--n:${n}">${cells}</div>`
    : `<div class="q-row">${nexo({mood:"think"})}<div class="say">Toca las piezas para girarlas. La corriente sale de la batería y tiene que llegar al LED.</div></div><div class="cboard" style="--n:${n}">${cells}</div><p class="small muted" style="text-align:center">Movimientos: ${C.moves} · Las piezas encendidas ya reciben corriente.</p>`;
  gameShell("Circuito completo", `<span class="pill s-accepted">Nivel ${s.level||1}</span>`, body);
}
function circuitRotate(k){
  const C=G.C; if(circuitLit(C).solved) return;
  C.grid[k].m=rot(C.grid[k].m); C.moves++; SFX.tap();
  if(circuitLit(C).solved){ const s=gp("circuit"); s.solved=(s.solved||0)+1; s.level=(s.level||1)+1; G.reward=gameReward(5,2); SFX.win(); buzz([40,60,40]); }
  circuitRender();
}

/* ----- Juego 2: Programa a Nexo ----- */
const CODE_LEVELS = [
  {map:[".....","S..B.","....."], tip:"Nexo mira hacia la derecha. ¿Cuántos pasos necesita?"},
  {map:["....B",".....","S...."], tip:"Girar no mueve a Nexo: solo cambia hacia dónde mira."},
  {map:["S.#..","..#.B","....."], tip:"Los bloques oscuros son paredes. Rodéalas."},
  {map:[".....",".###.","S#B..","....."], tip:"A veces hay que alejarse para poder llegar."},
  {map:["S#...",".#.#.",".#.#.","...#B"], tip:"Un zigzag: planea todo el camino antes de ejecutar."},
  {map:["B..#.","##.#.","...#.",".#...","S#..."], tip:"Último desafío. ¡Tú puedes!"}
];
function codeParse(L){ const rows=L.map; let S,B; const walls=new Set(); rows.forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch==="S") S=[r,c]; if(ch==="B") B=[r,c]; if(ch==="#") walls.add(r+","+c); })); return {rows:rows.length, cols:rows[0].length, S, B, walls}; }
function codeOptimal(L){
  const g=codeParse(L), start=[g.S[0],g.S[1],1], key=s=>s.join(","), seen=new Map([[key(start),0]]), q=[start];
  while(q.length){ const s=q.shift(), d=seen.get(key(s)); if(s[0]===g.B[0]&&s[1]===g.B[1]) return d;
    const nx=[[s[0],s[1],(s[2]+3)%4],[s[0],s[1],(s[2]+1)%4],[s[0]+DR[s[2]],s[1]+DC[s[2]],s[2]]];
    for(const t of nx){ if(t[0]<0||t[1]<0||t[0]>=g.rows||t[1]>=g.cols||g.walls.has(t[0]+","+t[1])) continue; if(!seen.has(key(t))){ seen.set(key(t),d+1); q.push(t); } } }
  return null;
}
const CMD = {F:{label:"Avanzar", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>'},
             L:{label:"Girar izq.", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg>'},
             R:{label:"Girar der.", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h2"/></svg>'}};
const MAXPROG=20;
function codeStart(li){
  const s=gp("code"); s.done=s.done||{};
  if(li===undefined){ li=0; while(li<CODE_LEVELS.length-1 && s.done[li]) li++; }
  const g=codeParse(CODE_LEVELS[li]);

  codeRender();
}
function codeRender(){
  const K=G.K, g=K.g, s=gp("code"), opt=codeOptimal(CODE_LEVELS[K.li]);
  let board="";
  for(let r=0;r<g.rows;r++) for(let c=0;c<g.cols;c++){
    const wall=g.walls.has(r+","+c), isB=g.B[0]===r&&g.B[1]===c, isN=K.pos[0]===r&&K.pos[1]===c;
    board += `<div class="kcell ${wall?"wall":""}">${isB&&!isN?`<span class="kbat">${I.battery}</span>`:""}${isN?`<span class="knexo" style="--rot:${K.dir*90}deg">${nexo({mood:K.msg&&K.msg.ok===false?"sad":K.msg&&K.msg.ok?"dance":"normal", cls:"still"})}<i class="karrow"></i></span>`:""}</div>`;
  }
  const levels = CODE_LEVELS.map((_,i)=>`<button class="chip ${i===K.li?"on":""}" data-act="kLevel" data-v="${i}" ${i>0&&!s.done[i-1]&&!s.done[i]?"disabled":""}>${s.done[i]?"★".repeat(s.done[i]):i+1}</button>`).join("");
  let body;
  if(K.msg && K.msg.ok){
    body = gameWin(`¡Nexo llegó a su batería! ${"★".repeat(K.msg.stars)}`, `Usaste ${K.prog.length} órdenes. La solución más corta usa ${opt}.${K.msg.stars<3?" Prueba hacerlo con menos para ganar 3 estrellas.":""}`, K.msg.reward,
      `${K.li<CODE_LEVELS.length-1?`<button class="btn grad" data-act="kLevel" data-v="${K.li+1}">Siguiente nivel</button>`:""}<button class="btn ghost" data-act="kLevel" data-v="${K.li}">Repetir</button>`);
  } else {
    body = `<div class="filter-row" style="justify-content:center">${levels}</div>
    <div class="q-row">${nexo({mood:"think"})}<div class="say">${esc(CODE_LEVELS[K.li].tip)}</div></div>
    <div class="kboard" style="--cols:${g.cols}">${board}</div>

    <div class="kprog" aria-label="Tu programa">${K.prog.length?K.prog.map((c,i)=>`<button class="kcmd ${i===K.step?"run":""}" data-act="kDel" data-v="${i}" ${K.running?"disabled":""} aria-label="Quitar ${CMD[c].label}"><b>${i+1}</b>${CMD[c].icon}</button>`).join(""):`<span class="small muted">Toca las órdenes de abajo para armar el programa. Toca una orden del programa para quitarla.</span>`}</div>
    <div class="kpal">${Object.entries(CMD).map(([k,c])=>`<button class="btn ghost" data-act="kAdd" data-v="${k}" ${K.running||K.prog.length>=MAXPROG?"disabled":""}>${c.icon}${c.label}</button>`).join("")}</div>`;

  gameShell("Programa a Nexo", `<span class="pill s-accepted">Nivel ${K.li+1} · ${K.prog.length}/${MAXPROG}</span>`, body, foot);

async function codeRun(){
  const K=G.K, g=K.g; K.running=true; K.msg=null; K.pos=g.S.slice(); K.dir=1; K.step=-1; codeRender();
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  for(let i=0;i<K.prog.length;i++){
    if(!G || G.K!==K) return;
    K.step=i; const c=K.prog[i];
    if(c==="L") K.dir=(K.dir+3)%4; else if(c==="R") K.dir=(K.dir+1)%4;
    else { const nr=K.pos[0]+DR[K.dir], nc=K.pos[1]+DC[K.dir];
      if(nr<0||nc<0||nr>=g.rows||nc>=g.cols||g.walls.has(nr+","+nc)){ K.running=false; K.msg={ok:false, text:`¡Nexo chocó en la orden ${i+1}! Revisa el programa y vuelve a probar.`}; SFX.bad(); buzz(120); codeRender(); return; }
      K.pos=[nr,nc]; }

  K.running=false; K.step=-1;
  if(K.pos[0]===g.B[0] && K.pos[1]===g.B[1]){
    const opt=codeOptimal(CODE_LEVELS[K.li]), n=K.prog.length, stars = n<=opt?3:n<=opt+2?2:1, s=gp("code"), first=!s.done[K.li];
    s.done[K.li]=Math.max(s.done[K.li]||0, stars);
    K.msg={ok:true, stars, reward: gameReward(first?8:2, first?3:1)}; SFX.win(); buzz([40,60,40]);
  } else { K.msg={ok:false, text:"Nexo terminó el programa pero no llegó a la batería. Agrega o cambia órdenes."}; SFX.bad(); }
  codeRender();
}

/* ----- Juego 3: Ohm exprés ----- */
const fmtN = x => Number(x.toPrecision(4)).toLocaleString("es-AR",{maximumFractionDigits:3});
const fmtI = a => a<1 ? `${fmtN(a*1000)} mA` : `${fmtN(a)} A`;
function ohmQuestion(){
  const Rs=[10,22,47,100,150,220,330,470,1000], Is=[0.005,0.01,0.02,0.05,0.1,0.2,0.5];
  let R,Iv,V; do { R=pickOne(Rs); Iv=pickOne(Is); V=Math.round(R*Iv*1000)/1000; } while(V<0.5 || V>24 || Math.abs(Math.round(V*10)-V*10)>1e-6);
  const kind=pickOne(["V","I","R"]);
  let q, ans, fmt;
  if(kind==="V"){ q=`R = ${R} Ω e I = ${fmtI(Iv)}. ¿Cuánto vale V?`; ans=V; fmt=x=>`${fmtN(x)} V`; }
  if(kind==="I"){ q=`V = ${fmtN(V)} V y R = ${R} Ω. ¿Cuánto vale I?`; ans=Iv; fmt=fmtI; }
  if(kind==="R"){ q=`V = ${fmtN(V)} V e I = ${fmtI(Iv)}. ¿Cuánto vale R?`; ans=R; fmt=x=>`${fmtN(x)} Ω`; }
  const opts=new Set([fmt(ans)]);
  for(const f of shuffle([10,0.1,2,0.5,5,0.2,3])){ if(opts.size>=4) break; opts.add(fmt(ans*f)); }
  return {q, ans:fmt(ans), opts:shuffle([...opts])};
}
function ohmIntro(){
  G.O=null;
  gameShell("Ohm exprés","",`<div class="done-screen">${nexo({mood:"wow"})}<h2 style="background:none;color:var(--fg)">Ley de Ohm contra reloj</h2>
    <div class="ohm-help"><b>V = I × R</b><span>I = V ÷ R</span><span>R = V ÷ I</span></div>
    <p class="muted">Tienes 60 segundos. Cada acierto suma 10 puntos y con 3 seguidos ganas bonus. Un error resta 3 segundos.</p>
    <p class="small muted">Récord: ${gp("ohm").best||0} puntos</p><button class="btn grad" data-act="oStart">${I.play}Empezar</button></div>`);
}
function ohmStart(){
  G.O={score:0, combo:0, left:60, hits:0, miss:0, q:ohmQuestion(), lock:false, end:Date.now()+60000};
  G.timer=setInterval(()=>{ if(!G||!G.O) return; G.O.left=Math.max(0,(G.O.end-Date.now())/1000); const bar=$("#ohmBar"); if(bar) bar.style.width=(G.O.left/60*100)+"%"; const t=$("#ohmT"); if(t) t.textContent=Math.ceil(G.O.left); if(G.O.left<=0) ohmEnd(); },200);
  ohmRender();
}
function ohmRender(fb){
  const O=G.O;
  gameShell("Ohm exprés", `<span class="pill s-accepted num"><span id="ohmT">${Math.ceil(O.left)}</span> s · ${O.score} pts</span>`,
   `<div class="progress gold"><i id="ohmBar" style="width:${O.left/60*100}%"></i></div>
    ${O.combo>=3?`<p class="combo" style="text-align:center">Combo ×${O.combo}</p>`:""}
    <div class="ohm-help small"><b>V = I × R</b><span>I = V ÷ R</span><span>R = V ÷ I</span></div>
    <h2 class="ls-q" style="text-align:center">${esc(O.q.q)}</h2>
    <div class="opts ohm-opts">${O.q.opts.map(o=>`<button class="opt ${fb&&o===O.q.ans?"good":""} ${fb&&fb.pick===o&&!fb.ok?"wrong":""}" data-act="oPick" data-v="${esc(o)}" ${fb?"disabled":""}>${esc(o)}</button>`).join("")}</div>`);
}
function ohmPick(v){
  const O=G.O; if(!O || O.lock) return; O.lock=true;
  const ok = v===O.q.ans;
  if(ok){ O.combo++; O.hits++; O.score += 10 + (O.combo>=3?5:0); SFX.ok(); buzz(20); }
  else { O.combo=0; O.miss++; O.end-=3000; SFX.bad(); buzz([50,30,50]); }
  ohmRender({pick:v, ok});
  setTimeout(()=>{ if(!G||G.O!==O||O.left<=0) return; O.q=ohmQuestion(); O.lock=false; ohmRender(); }, ok?450:900);
}
function ohmEnd(){
  const O=G.O; clearInterval(G.timer); G.timer=null; if(O.done) return; O.done=true;
  const s=gp("ohm"), rec = O.score>(s.best||0); if(rec) s.best=O.score;
  const r = gameReward(Math.min(15, Math.floor(O.score/10)), Math.floor(O.score/30));
  SFX.win();
  gameShell("Ohm exprés","", gameWin(rec&&O.score>0?"¡Nuevo récord!":"¡Tiempo!", `Hiciste ${O.score} puntos: ${O.hits} aciertos y ${O.miss} errores.`, r, `<button class="btn grad" data-act="oStart">Jugar otra vez</button><button class="btn ghost" data-act="gClose">Salir</button>`));
}

const MEM_PAIRS=[["Sensor","Recoge información"],["Motor DC","Gira sin parar"],["Servo","Va a un ángulo exacto"],["LED","Da luz"],["Batería","Da energía"],["Arduino","Es el cerebro"],["Resistencia","Frena la corriente"],["HC-SR04","Mide distancia"],["LDR","Detecta la luz"],["Buzzer","Hace sonidos"],["GND","Por donde vuelve la corriente"],["Puente H","Controla los motores"]];
function memStart(){
  const pairs=shuffle(MEM_PAIRS).slice(0,6);
  G.M={cards:shuffle(pairs.flatMap((p,i)=>[{pair:i,text:p[0],kind:"t"},{pair:i,text:p[1],kind:"d"}])), open:[], found:new Set(), moves:0, lock:false, t0:Date.now()};
  memRender();
}
function memRender(){
  const M=G.M;
  const body = M.done ? M.done : `<div class="q-row">${nexo({mood:"think"})}<div class="say">Da vuelta dos cartas. Si un componente coincide con lo que hace, quedan a la vista.</div></div>
    <div class="mgrid">${M.cards.map((c,i)=>{ const up=M.open.includes(i)||M.found.has(c.pair); return `<button class="mcard ${up?"up":""} ${M.found.has(c.pair)?"ok":""} ${c.kind}" data-act="mFlip" data-v="${i}" ${up?"disabled":""} aria-label="${up?esc(c.text):"Carta boca abajo"}"><span class="face">${up?esc(c.text):""}</span></button>`; }).join("")}</div>`;
  gameShell("Memoria robótica", `<span class="pill s-accepted num">${M.found.size}/6 · ${M.moves} mov.</span>`, body);
}
function memFlip(i){
  const M=G.M; if(M.lock || M.open.includes(i)) return;
  M.open.push(i); SFX.tap();
  if(M.open.length===2){
    M.moves++; const [a,b]=M.open.map(k=>M.cards[k]);
    if(a.pair===b.pair){ M.found.add(a.pair); M.open=[]; SFX.ok();
      if(M.found.size===6){ const s=gp("memory"), rec=!s.best||M.moves<s.best; if(rec) s.best=M.moves;
        const r=gameReward(M.moves<=9?10:6, 3); SFX.win();
        M.done = gameWin(rec?"¡Nuevo récord!":"¡Todas las parejas!", `Lo lograste en ${M.moves} movimientos y ${Math.round((Date.now()-M.t0)/1000)} segundos.`, r, `<button class="btn grad" data-act="mAgain">Jugar otra vez</button><button class="btn ghost" data-act="gClose">Salir</button>`); } }
    else { M.lock=true; memRender(); setTimeout(()=>{ if(!G||G.M!==M) return; M.open=[]; M.lock=false; memRender(); }, 900); return; }
  }
  memRender();
}

document.addEventListener("click", e=>{
  const a=e.target.closest("[data-act]"); if(!a || a.disabled) return;
  const act=a.dataset.act, v=a.dataset.v;
  switch(act){
    case "nav": if(G) closeGame(); break;
    case "gOpen": openGame(v); break;
    case "gClose": closeGame(); break;
    case "cRot": circuitRotate(+v); break;
    case "cNext": G.reward=null; circuitStart(); break;
    case "kAdd": if(G.K.prog.length<MAXPROG){ G.K.prog.push(v); G.K.msg=null; SFX.tap(); codeRender(); } break;
    case "kDel": G.K.prog.splice(+v,1); G.K.msg=null; codeRender(); break;
    case "kClear": G.K.prog=[]; G.K.msg=null; G.K.pos=G.K.g.S.slice(); G.K.dir=1; codeRender(); break;
    case "kRun": codeRun(); break;
    case "kLevel": codeStart(+v); break;
    case "oStart": ohmStart(); break;
    case "oPick": ohmPick(v); break;
    case "mFlip": memFlip(+v); break;
    case "mAgain": memStart(); break;
  }
});

  <h2>Primero: ¿qué es un robot?</h2>
  <p>Un robot es una máquina que puede hacer una tarea sola, o casi sola. Para lograrlo necesita tres capacidades, igual que una persona:</p>
  <ul><li><b>Sentir:</b> darse cuenta de lo que pasa. Para eso usa ${T("Sensor","sensores")}, que son como sus ojos, oídos y piel.</li>
  <li><b>Pensar:</b> decidir qué hacer con esa información. Lo hace un pequeño cerebro electrónico llamado ${T("Microcontrolador","controlador")}.</li>
  <li><b>Actuar:</b> hacer algo en el mundo real, como moverse, agarrar o encender una luz. Para eso usa ${T("Actuador","actuadores")}, que son sus músculos.</li></ul>
  ${FIG.cycle}
  <h2>¿Cómo sé si algo es un robot?</h2>
  <p>Hazte tres preguntas. Si la respuesta a las tres es “sí”, probablemente sea un robot.</p>
  <div class="tablewrap"><table class="compare"><thead><tr><th>Máquina</th><th>¿Siente?</th><th>¿Decide?</th><th>¿Actúa?</th><th>¿Es robot?</th></tr></thead><tbody>
    <tr><td>Aspiradora que esquiva muebles</td><td>${yes}</td><td>${yes}</td><td>${yes}</td><td><b>Sí</b></td></tr>
    <tr><td>Brazo que suelda autos en una fábrica</td><td>${yes}</td><td>${yes}</td><td>${yes}</td><td><b>Sí</b></td></tr>
    <tr><td>Auto a control remoto</td><td>${no}</td><td>${no}</td><td>${yes}</td><td>No: decide una persona</td></tr>
    <tr><td>Linterna</td><td>${no}</td><td>${no}</td><td>${yes}</td><td>No</td></tr>
  </tbody></table></div>
  <div class="callout">${I.bulb}<div><b>Ojo:</b> un robot no tiene que parecerse a una persona. La mayoría son brazos, carritos, drones o cajas con ruedas. Los que tienen forma humana se llaman ${T("Humanoide","humanoides")} y son pocos.</div></div>
  <h2>¿Y entonces qué es la robótica?</h2>
  <p>La robótica es el área que junta todo lo necesario para crear un robot: pensar cómo va a ser su cuerpo, conectar sus circuitos y escribir el programa que le dice qué hacer. Por eso mezcla varias ciencias, que vas a conocer en el capítulo 2.</p>
  <p>No hace falta ser ingeniero para empezar. Con una placa como ${T("Arduino")}, unos cables y un sensor ya puedes armar tu primer robot en casa o en la escuela.</p>
  <h2>Nuestro proyecto: el garaje eléctrico</h2>
  <p>Para entender la robótica, nada mejor que un ejemplo real. Armamos un <b>garaje eléctrico</b>: un garaje en miniatura que <b>se da cuenta solo</b> cuando llega un auto, <b>abre el portón</b> y <b>avisa con luces</b> si está abierto o cerrado. Hace lo mismo que cualquier robot: siente, piensa y actúa.</p>
  ${GARAGE_FIG}
  <div class="comps">
    <div class="comp c-sense"><span class="comp-ic">${GI.sonar}</span><div><span class="comp-role">Siente · los ojos</span><b>Sensor de ultrasonido</b><p>Lanza un sonido que no escuchamos y espera el eco, como hacen los murciélagos. Así sabe a qué distancia hay algo.</p><p class="comp-use"><b>En el garaje:</b> detecta cuando un auto se acerca a la puerta.</p></div></div>
    <div class="comp c-think"><span class="comp-ic">${GI.board}</span><div><span class="comp-role">Piensa · el cerebro</span><b>Placa Arduino UNO con cables</b><p>Una pequeña computadora que sigue las instrucciones que le programamos. Los cables conectan cada pieza con la placa, como los nervios del cuerpo.</p><p class="comp-use"><b>En el garaje:</b> recibe el aviso del sensor y decide abrir o cerrar.</p></div></div>
    <div class="comp c-act"><span class="comp-ic">${GI.servo}</span><div><span class="comp-role">Actúa · los músculos</span><b>Servomotores</b><p>Motores que giran hasta un ángulo exacto, de 0° a 180°, y se quedan quietos ahí. No giran sin parar como un ventilador.</p><p class="comp-use"><b>En el garaje:</b> levantan y bajan el portón a la posición justa.</p></div></div>
    <div class="comp c-act"><span class="comp-ic">${GI.leds}</span><div><span class="comp-role">Actúa · avisa</span><b>Luces LED de abierto y cerrado</b><p>Lucecitas que gastan muy poca energía. Cada color tiene un significado, como un semáforo.</p><p class="comp-use"><b>En el garaje:</b> <span class="dot g"></span>verde = abierto, se puede pasar. <span class="dot r"></span>rojo = cerrado.</p></div></div>
    <div class="comp c-power"><span class="comp-ic">${GI.bat}</span><div><span class="comp-role">Energía · la comida</span><b>Batería de 9 voltios</b><p>Guarda la electricidad que hace funcionar todo. Gracias a ella el garaje anda sin estar enchufado a la computadora.</p><p class="comp-use"><b>En el garaje:</b> le da energía a la placa Arduino y, a través de ella, a todo lo demás.</p></div></div>
  </div>
  <div class="callout soft">${I.info}<div><b>En resumen:</b> el <b>sensor</b> ve el auto → el <b>Arduino</b> decide abrir → los <b>servomotores</b> suben el portón → el <b>LED verde</b> se enciende. Cuando el auto se va, todo vuelve a cerrarse y se prende el <b>rojo</b>. Y la <b>batería</b> le da energía a todo.</div></div>
  <h2>¿Para qué sirven los robots?</h2>
  <div class="uses">
    <div><b>Tareas peligrosas</b><span>Desactivar explosivos, entrar a zonas con fuego o radiación.</span></div>
    <div><b>Tareas repetitivas</b><span>Armar, soldar o pintar miles de piezas iguales en una fábrica.</span></div>
    <div><b>Tareas muy precisas</b><span>Ayudar a los cirujanos en operaciones delicadas.</span></div>
    <div><b>Lugares lejanos</b><span>Explorar Marte o el fondo del mar, donde las personas no pueden ir.</span></div>
    <div><b>Ayudar en casa</b><span>Limpiar el piso, cortar el pasto o asistir a personas mayores.</span></div>
    <div><b>Aprender</b><span>Los robots educativos enseñan ciencia, matemática y programación jugando.</span></div>
  </div>
  <div class="callout soft">${I.info}<div><b>¿Sabías que?</b> La palabra “robot” viene del checo <i>robota</i>, que significa trabajo pesado u obligatorio. La conocerás en la historia del capítulo 3.</div></div>`,
  quiz:[
    {q:"¿Qué tres cosas hace un robot?", o:["Siente, piensa y actúa","Corre, salta y nada","Habla, canta y baila"], a:0, ex:"Siente con sus sensores, piensa con su controlador y actúa con sus motores."},
    {q:"Un auto a control remoto, ¿es un robot?", o:["No, porque las decisiones las toma una persona","Sí, porque se mueve","Sí, porque tiene pilas"], a:0, ex:"Moverse no alcanza: un robot decide por su cuenta según lo que detecta."},
    {q:"¿Todos los robots tienen forma de persona?", o:["No, la mayoría no","Sí, siempre"], a:0, ex:"Hay brazos, carritos, drones y muchas otras formas."}
  ]},
{ n:2, title:"Los conceptos de la robótica", kicker:"Cómo funciona un robot", read:"12 min",
  desc:"La idea principal, las cinco partes de todo robot, las ciencias que la forman, cómo se controla, se mueve y piensa, y los tipos de robots.",
  lead:"Todo robot, desde una aspiradora hasta un rover en Marte, se apoya en las mismas ideas. Si entiendes este capítulo, entiendes cualquier robot.",
  tldr:["Lo principal: el ciclo <b>sentir → pensar → actuar</b>, repetido sin parar.","Cinco partes: <b>sensores, controlador, actuadores, energía y estructura</b>.","Tres ciencias: <b>mecánica, electrónica y programación</b>.","Además: <b>control</b>, <b>mecanismos</b>, <b>programas e IA</b> y <b>seguridad</b>."],
  body:`
  <h2>Lo principal: sentir, pensar, actuar</h2>
  <p>Si tuvieras que quedarte con una sola idea de la robótica, sería esta. Un robot repite un ciclo una y otra vez, muchas veces por segundo:</p>
  <ol class="steps-list"><li><b>Siente:</b> mide algo del mundo (una distancia, la luz, un botón).</li><li><b>Piensa:</b> compara esa medida con las reglas de su programa.</li><li><b>Actúa:</b> mueve un motor, enciende una luz o hace un sonido.</li><li><b>Vuelve a empezar</b> y revisa si lo que hizo funcionó.</li></ol>
  <p>Ese último paso, revisar el resultado y corregir, se llama ${T("Retroalimentación","retroalimentación")}. Es lo que permite que un robot que sigue una línea se mantenga sobre ella aunque la línea haga curvas.</p>
  <h2>Las cinco partes de un robot</h2>
  <p>Mira este carrito robot. Tiene las mismas cinco partes que cualquier otro robot:</p>
  ${ENC_FIG.anatomy}
  <div class="parts">
    <div class="part c1"><b>1. Sensores</b><p>Recogen información del entorno: distancia, luz, temperatura, sonido.</p><span>Ejemplo: el ${T("Ultrasonido","sensor de ultrasonido")} mide a qué distancia está una pared.</span></div>
    <div class="part c2"><b>2. Controlador</b><p>Es el cerebro: lee los sensores, sigue el programa y da órdenes.</p><span>Ejemplo: la placa ${T("Arduino")}.</span></div>
    <div class="part c3"><b>3. Actuadores</b><p>Convierten la electricidad en movimiento, luz o sonido.</p><span>Ejemplo: motores, ${T("Servomotor","servomotores")}, LEDs, parlantes.</span></div>
    <div class="part c4"><b>4. Energía</b><p>Le da vida a todo lo demás.</p><span>Ejemplo: pilas, baterías recargables o un cable a la corriente.</span></div>
    <div class="part c5"><b>5. Estructura</b><p>Sostiene y protege las piezas. También se llama ${T("Chasis","chasis")}.</p><span>Ejemplo: una base de acrílico, madera, cartón o piezas impresas en 3D.</span></div>
  </div>
  <h2>Las ciencias que forman la robótica</h2>
  <p>La robótica no es una sola materia: es el lugar donde se encuentran tres.</p>
  ${ENC_FIG.venn}
  <ul><li><b>Mecánica:</b> el cuerpo del robot. Cómo se mueve, qué fuerza tiene, cómo encajan los engranajes y las ruedas.</li>
  <li><b>Electrónica:</b> los circuitos que llevan la energía y las señales entre las piezas.</li>
  <li><b>Programación:</b> las instrucciones que le dicen al robot qué hacer en cada situación. Una lista de pasos para resolver un problema se llama ${T("Algoritmo","algoritmo")}.</li></ul>
  <p>Cuando se juntan mecánica y electrónica se habla de ${T("Mecatrónica","mecatrónica")}. Y en los robots más avanzados se suma la <b>inteligencia artificial</b>, que les permite aprender de ejemplos, reconocer imágenes o entender la voz.</p>
  <h2>Otros conceptos clave</h2>
  <div class="defs">
    <div><b>${T("Autónomo","Autonomía")}</b><span>Qué tanto puede trabajar un robot sin ayuda de una persona.</span></div>
    <div><b>Programa</b><span>El conjunto de instrucciones que el controlador ejecuta. Sin programa, el robot no hace nada.</span></div>
    <div><b>Señal digital y analógica</b><span>Digital: solo dos valores, encendido o apagado. Analógica: muchos valores intermedios, como el volumen de una radio.</span></div>
    <div><b>${T("Grados de libertad","Grados de libertad")}</b><span>Cuántos movimientos distintos puede hacer un robot. Tu brazo tiene 7.</span></div>
  </div>
  <h2>Cómo se controla un robot</h2>
  <p>Hay dos formas de controlar una máquina:</p>
  <ul><li><b>Lazo abierto:</b> da la orden y no revisa el resultado. Un tostador con temporizador tuesta el tiempo indicado aunque el pan se queme.</li>
  <li><b>Lazo cerrado:</b> da la orden, mide el resultado con un sensor y corrige. Un aire acondicionado mide la temperatura y se apaga al llegar a la que elegiste.</li></ul>
  ${FIG.loop}
  <p>Casi todos los robots usan <b>lazo cerrado</b>, gracias a la ${T("Retroalimentación","retroalimentación")}.</p>
  <h2>Cómo se mueve un robot</h2>
  <p>Los motores giran, pero el robot necesita mover ruedas, brazos o pinzas. Para llevar ese movimiento se usan mecanismos:</p>
  <ul><li><b>${T("Engranaje","Engranajes")}:</b> ruedas con dientes. Si uno chico mueve a uno grande, se gana fuerza y se pierde velocidad.</li>
  <li><b>Poleas y correas:</b> como la cadena de una bicicleta.</li>
  <li><b>Palancas:</b> barras que giran sobre un punto y multiplican la fuerza.</li></ul>
  ${FIG.gears}
  <p>Un brazo robótico se describe por sus ${T("Grados de libertad","grados de libertad")} y por la herramienta de su punta, el ${T("Efector final","efector final")}: una pinza, una ventosa o un soldador.</p>
  <h2>Cómo piensa un robot</h2>
  <p>El controlador sigue un <b>programa</b>. Un programa usa ideas muy simples combinadas: <b>secuencias</b> (hacer pasos en orden), <b>condiciones</b> (si pasa esto, hago aquello) y <b>bucles</b> (repetir). Con solo eso se pueden hacer robots muy completos.</p>
  <p>Algunos robots además usan ${T("Inteligencia artificial","inteligencia artificial")}: en vez de seguir solo reglas escritas a mano, aprenden de miles de ejemplos. Así reconocen objetos con una cámara (${T("Visión artificial","visión artificial")}) o entienden la voz.</p>
  <h2>Robótica segura y responsable</h2>
  <ul><li>Todo robot importante tiene un <b>botón de parada de emergencia</b>.</li><li>Los robots grandes trabajan detrás de rejas o con sensores que los frenan si alguien se acerca.</li><li>La ${T("Ética","ética")} de la robótica se pregunta quién es responsable si un robot se equivoca, cómo cuidar la privacidad y cómo ayudar a las personas cuyos trabajos cambian.</li></ul>
  <div class="callout">${I.bulb}<div><b>Regla de oro:</b> la seguridad de las personas siempre va primero.</div></div>
  <h2>Tipos de robots</h2>
  <div class="kinds">
    <div><b>Industriales</b><span>Brazos que arman, sueldan y pintan en fábricas.</span></div>
    <div><b>Móviles</b><span>Se desplazan con ruedas, patas, hélices o aletas. Los drones son robots móviles voladores.</span></div>
    <div><b>Humanoides</b><span>Tienen forma parecida a la de una persona.</span></div>
    <div><b>De servicio</b><span>Ayudan en casas, hospitales, hoteles o tiendas.</span></div>
    <div><b>Médicos</b><span>Asisten en cirugías o funcionan como prótesis.</span></div>
    <div><b>De exploración</b><span>Van a lugares extremos, como los ${T("Rover","rovers")} de Marte.</span></div>
    <div><b>Colaborativos</b><span>Trabajan al lado de personas de forma segura. Se llaman ${T("Cobot","cobots")}.</span></div>
    <div><b>Educativos</b><span>Kits para aprender a construir y programar, como los de este sitio.</span></div>
  </div>`,
  quiz:[
    {q:"¿Qué es lo principal de cualquier robot?", o:["El ciclo sentir, pensar y actuar","Tener forma humana","Ser muy rápido"], a:0, ex:"Todos los robots repiten ese ciclo, sin importar su forma."},
    {q:"¿Qué parte convierte la electricidad en movimiento?", o:["El actuador","El sensor","El chasis"], a:0, ex:"Motores y servomotores son actuadores: los músculos del robot."},
    {q:"¿Cuáles son las tres ciencias que forman la robótica?", o:["Mecánica, electrónica y programación","Historia, geografía y música","Química, biología y dibujo"], a:0, ex:"El cuerpo, los circuitos y las instrucciones."},
    {q:"Un robot mide el resultado de su acción y se corrige. Eso es…", o:["Lazo cerrado","Lazo abierto","Un cortocircuito"], a:0, ex:"El sensor avisa y el control corrige."}
  ]},
{ n:3, title:"Historia de la robótica", kicker:"De dónde venimos", read:"7 min",
  desc:"Desde los autómatas de la antigüedad hasta los robots que hoy exploran Marte.",
  lead:"La idea de construir máquinas que se muevan solas tiene más de dos mil años. La palabra “robot” recién apareció hace un siglo.",
  tldr:["Primero hubo <b>autómatas</b>: muñecos y máquinas que se movían con engranajes, agua o aire.","La palabra <b>robot</b> nació en 1920 en una obra de teatro checa.","En 1961 empezó a trabajar el primer robot industrial, y hoy hay robots hasta en Marte."],
  body:`
  <p>Un ${T("Autómata","autómata")} es una máquina que repite movimientos por sí misma, pero sin sensores: siempre hace lo mismo. Los autómatas fueron los abuelos de los robots.</p>
  <div class="timeline">
   <h3 class="era">Antes de la palabra “robot”: los autómatas</h3>
   <div class="ev"><span class="yr">c. 400 a. C.</span><div><b>La paloma de Arquitas</b><p>Según relatos antiguos, el griego Arquitas de Tarento construyó una paloma de madera que volaba impulsada por aire.</p></div></div>
   <div class="ev"><span class="yr">Siglo I</span><div><b>Herón de Alejandría</b><p>Describió autómatas, puertas de templos que se abrían solas y un pequeño teatro que funcionaba sin personas.</p></div></div>
   <div class="ev"><span class="yr">1206</span><div><b>Al-Jazari</b><p>Este ingeniero escribió un libro con decenas de máquinas ingeniosas, entre ellas un grupo de músicos autómatas que tocaba en un barco sobre un lago.</p></div></div>
   <div class="ev"><span class="yr">1495</span><div><b>El caballero de Leonardo da Vinci</b><p>Leonardo diseñó una armadura que podía sentarse y mover los brazos y la cabeza gracias a poleas y cables.</p></div></div>
   <div class="ev"><span class="yr">1739</span><div><b>El pato de Vaucanson</b><p>Un pato mecánico que movía las alas y parecía comer y digerir. Fue la sensación de Europa.</p></div></div>
   <div class="ev"><span class="yr">Década de 1770</span><div><b>“El escritor” de Jaquet-Droz</b><p>Un muñeco que escribía con pluma y tinta. Se podía cambiar el texto: fue como un programa antiguo.</p></div></div>
   <h3 class="era">Nace la palabra “robot”</h3>
   <div class="ev hl"><span class="yr">1920</span><div><b>Nace la palabra “robot”</b><p>El escritor checo Karel Čapek la usó en su obra de teatro <i>R.U.R.</i>, estrenada en 1921. Se la sugirió su hermano, el pintor Josef Čapek. Viene de <i>robota</i>: trabajo pesado u obligatorio.</p></div></div>
   <div class="ev"><span class="yr">1942</span><div><b>Las Tres Leyes de Asimov</b><p>El escritor Isaac Asimov imaginó tres reglas para que los robots fueran seguros:</p>
     <ol class="laws"><li>Un robot no puede dañar a una persona, ni dejar que le pase algo malo por no actuar.</li><li>Un robot debe obedecer a las personas, salvo que eso rompa la primera ley.</li><li>Un robot debe cuidarse a sí mismo, salvo que eso rompa la primera o la segunda ley.</li></ol>
     <p>Eran ciencia ficción, pero hoy inspiran las reglas de seguridad reales, como los botones de parada de emergencia. Asimov también fue quien inventó la palabra “robótica”.</p></div></div>
   <div class="ev"><span class="yr">1948</span><div><b>Las tortugas de Grey Walter</b><p>Dos pequeños robots llamados Elmer y Elsie buscaban la luz y esquivaban obstáculos con sensores muy simples. Fueron de los primeros robots autónomos.</p></div></div>
   <h3 class="era">Robots que trabajan</h3>
   <div class="ev hl"><span class="yr">1961</span><div><b>Unimate, el primer robot industrial</b><p>Creado por George Devol y Joseph Engelberger, este brazo empezó a trabajar en una fábrica de autos de General Motors levantando piezas de metal calientes.</p></div></div>
   <div class="ev"><span class="yr">1966 a 1972</span><div><b>Shakey</b><p>El primer robot móvil capaz de razonar sobre lo que hacía: miraba con una cámara y planeaba su camino.</p></div></div>
   <div class="ev"><span class="yr">1973</span><div><b>WABOT-1</b><p>En Japón, la Universidad de Waseda presentó el primer robot humanoide de tamaño real. Caminaba y podía agarrar objetos.</p></div></div>
   <h3 class="era">Robots que exploran</h3>
   <div class="ev"><span class="yr">1997</span><div><b>Sojourner llega a Marte</b><p>El primer ${T("Rover","rover")} en recorrer otro planeta. Era del tamaño de un microondas.</p></div></div>
   <div class="ev"><span class="yr">2012</span><div><b>Curiosity</b><p>Un rover del tamaño de un auto que todavía estudia las rocas de Marte.</p></div></div>
   <div class="ev"><span class="yr">2021</span><div><b>Perseverance e Ingenuity</b><p>Ingenuity, un pequeño helicóptero, hizo el primer vuelo con motor en otro planeta.</p></div></div>
   <div class="ev"><span class="yr">2026</span><div><b>Robots con inteligencia artificial</b><p>Empresas y universidades presentan robots que aprenden a agarrar objetos, robots con “piel” sensible al tacto y drones que vuelan solos más rápido que pilotos campeones. Mira las novedades en la portada de NEXOR.</p></div></div>
   <h3 class="era">Robots en casa y en la escuela</h3>
   <div class="ev"><span class="yr">1999 y 2000</span><div><b>AIBO y ASIMO</b><p>Sony lanzó AIBO, un perro robot. Honda presentó ASIMO, un humanoide que caminaba, subía escaleras y saludaba.</p></div></div>
   <div class="ev"><span class="yr">2002</span><div><b>Roomba</b><p>La aspiradora robot que llevó la robótica a millones de casas.</p></div></div>
   <div class="ev hl"><span class="yr">2005</span><div><b>Nace Arduino</b><p>En Ivrea, Italia, crearon una placa barata y fácil de programar para estudiantes. Es la que usamos en las lecciones de NEXOR.</p></div></div>
   <div class="ev"><span class="yr">Hoy</span><div><b>Robots que trabajan con nosotros</b><p>Hay ${T("Cobot","robots colaborativos")} en fábricas, drones que revisan cultivos, robots que ayudan en cirugías y autos que ayudan a conducir. Y el próximo capítulo de esta historia lo puedes escribir tú.</p></div></div>
  </div>`,
  quiz:[
    {q:"¿De qué idioma viene la palabra “robot”?", o:["Del checo","Del inglés","Del japonés"], a:0, ex:"Viene de robota, que en checo significa trabajo pesado."},
    {q:"¿Cuál fue el primer robot industrial?", o:["Unimate","ASIMO","Roomba"], a:0, ex:"Empezó a trabajar en 1961 en una fábrica de autos."},
    {q:"¿En qué se diferencia un autómata de un robot?", o:["El autómata no tiene sensores: siempre repite lo mismo","El autómata es más moderno","No hay ninguna diferencia"], a:0, ex:"Sin sensores no puede adaptarse a lo que pasa a su alrededor."}
  ]}
];
const CH4 = {n:4, title:"Aprende jugando", kicker:"Practica todo", desc:"Lecciones de robótica y de tecnología e informática, minijuegos y ligas semanales para practicar lo que leíste."};

/* ---------- Noticias ---------- */
const NEWS_PER = 4;
let newsPage = 0;
function newsHTML(){
  const pages = Math.ceil(NEWS.length/NEWS_PER), pg = newsPage % pages;
  return NEWS.slice(pg*NEWS_PER, pg*NEWS_PER+NEWS_PER).map(n=>`<a class="news-it" href="${n.u}" target="_blank" rel="noopener noreferrer"><span class="news-d">${n.d}</span><span class="news-t">${esc(n.t)}</span><span class="news-s">${esc(n.s)} ${I.ext}</span></a>`).join("")
    + `<p class="small muted news-pg">Página ${pg+1} de ${pages}</p>`;
}

function chapterLesson(c){
  const steps = [...c.quiz.map(q=>({t:"mc", q:q.q, o:q.o, a:q.a, ex:q.ex})), ...(CH_EXTRA[c.n]||[])];
  return {id:"cap-"+c.n, title:`Capítulo ${c.n}: ${c.title}`, steps, chapter:c.n, unit:{title:"Enciclopedia"}};
}

    case "reject": { const note=$("#note-"+CSS.escape(id)).value.trim()||"El administrador pidió revisar el proyecto."; try{ await DB.updateProject(id,{status:"rejected", note}); await refreshData(["projects"]); toast("Se pidió al autor que haga cambios","info"); render(); }catch(err){ toast(errMsg(err),"info","err"); } break; }
    case "modEdit": modEdit=id; render(); break;
    case "modEditNo": modEdit=null; render(); break;
    case "modSave": { const t=$("#ed-t").value.trim(), s=$("#ed-s").value.trim(); try{ await DB.updateProject(id,{...(t?{title:t}:{}), ...(s?{summary:s}:{})}); modEdit=null; await refreshData(["projects"]); toast("Cambios guardados"); render(); }catch(err){ toast(errMsg(err),"info","err"); } break; }
    case "delAsk": delAsk=id; render(); break;
    case "delNo": delAsk=null; render(); break;
    case "delProj": try{ await DB.deleteProject(id); delAsk=null; await refreshData(["projects"]); toast("Proyecto eliminado","trash"); render(); }catch(err){ toast(errMsg(err),"info","err"); } break;
    case "ideaSet": try{ await DB.updateIdea(id,{status:v}); await refreshData(["ideas"]); toast({accepted:"Idea aceptada",added:"Idea marcada como agregada",rejected:"Idea archivada"}[v]); render(); }catch(err){ toast(errMsg(err),"info","err"); } break;
    case "ideaDel": try{ await DB.deleteIdea(id); await refreshData(["ideas"]); toast("Idea borrada","trash"); render(); }catch(err){ toast(errMsg(err),"info","err"); } break;
    case "lessonFromIdea": { const i=CACHE.ideas.find(x=>x.id===id); LB={editId:null, ideaId:i.id, ideaAuthor:i.author, title:i.title.slice(0,50), text:i.desc, qs:[emptyQ(),emptyQ()], errors:{}}; admTab="lecciones"; render(); window.scrollTo({top:0}); break; }
    case "lbAddQ": LB.qs.push(emptyQ()); render(); break;
    case "lbRmQ": LB.qs.splice(+a.dataset.i,1); render(); break;
    case "lbNew": LB=null; render(); break;
    case "lbPreview": { if(!lbValidate()) return render(); startLesson(null,{preview:true, lesson:{id:"preview", title:LB.title, steps:lbBuild().steps, unit:COMMUNITY_UNIT}}); break; }
    case "lbSave": {
      if(!lbValidate()){ render(); return toast("Revisa los campos marcados.","info","err"); }
      const data = {title:LB.title.trim(), steps:lbBuild().steps, status:v, ideaId:LB.ideaId||"", ideaAuthor:LB.ideaAuthor||"", author:USER.name};
      try{
        if(LB.editId) await DB.updateLesson(LB.editId, data);
        else await DB.addLesson({...data, created:Date.now()});
        if(LB.ideaId && v==="published") await DB.updateIdea(LB.ideaId,{status:"added"});
        LB=null; await refreshData(["lessons","ideas"]); toast(v==="published"?"¡Lección publicada en la ruta!":"Borrador guardado","bulb"); render();
      }catch(err){ toast(errMsg(err),"info","err"); }
      break; }
    case "lbEdit": { const l=CACHE.lessons.find(x=>x.id===id); const learn=l.steps.find(s=>s.t==="learn")||{};
      LB={editId:l.id, ideaId:l.ideaId||null, ideaAuthor:l.ideaAuthor||"", title:l.title, text:learn.text||"", qs:l.steps.filter(s=>s.t==="mc").map(s=>({q:s.q, o:[0,1,2,3].map(i=>s.o[i]||""), a:s.a, ex:s.ex||""})), errors:{}};
      while(LB.qs.length<2) LB.qs.push(emptyQ()); render(); window.scrollTo({top:0}); break; }
    case "lbToggle": { const l=CACHE.lessons.find(x=>x.id===id); try{ await DB.updateLesson(id,{status:l.status==="published"?"draft":"published"}); await refreshData(["lessons"]); render(); }catch(err){ toast(errMsg(err),"info","err"); } break; }
    case "lbDel": try{ await DB.deleteLesson(id); await refreshData(["lessons"]); toast("Lección borrada","trash"); render(); }catch(err){ toast(errMsg(err),"info","err"); } break;
  }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="fileInput"){ await handleFiles(t.files); t.value=""; return; }
  if(t.id==="docInput"){ await handleDocs(t.files); t.value=""; return; }
  if(t.dataset.act==="mat"){ const b=P.build[t.dataset.id]=P.build[t.dataset.id]||{m:[],s:[]}; b.m[+t.dataset.i]=t.checked; saveP(); }
  if(t.id==="pdiff"){ filters.diff=t.value; $("#pgrid").innerHTML=projectGrid(); }
  if(t.id==="psort"){ filters.sort=t.value; $("#pgrid").innerHTML=projectGrid(); }
  if(t.closest("#subForm") && t.dataset.k && W) W.d[t.dataset.k]=t.value;
  if(t.closest("#ideaForm") && t.dataset.k && IDEA) IDEA[t.dataset.k]=t.value;
  if(t.dataset.lb==="a" && LB){ LB.qs[+t.dataset.qi].a=+t.value; }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="pq"){ filters.q=t.value; $("#pgrid").innerHTML=projectGrid(); }
  if(t.id==="gq"){ glq=t.value; $("#glList").innerHTML=glossaryList(); }
  if(t.id==="ansInput"){ $("#mainBtn").disabled = !t.value.trim(); }
  if(t.closest("#subForm") && t.dataset.k && W) W.d[t.dataset.k]=t.value;
  if(t.closest("#ideaForm") && t.dataset.k && IDEA) IDEA[t.dataset.k]=t.value;
  if(t.closest("#authForm") && t.dataset.k) AUTH.vals[t.dataset.k]=t.value;
  if(t.dataset.lb && LB){ const k=t.dataset.lb, qi=+t.dataset.qi;
    if(k==="title"||k==="text") LB[k]=t.value; else if(k==="q"||k==="ex") LB.qs[qi][k]=t.value; else if(k==="o") LB.qs[qi].o[+t.dataset.oi]=t.value; }
});
/* Los formularios se envían con botones normales (no "submit"), porque algunos visores bloquean el envío de formularios. */
async function saveProfileForm(){ const name=$("#pf-name").value.trim(); if(name.length<2) return toast("El nombre necesita al menos 2 letras.","info","err");
  try{ USER = await DB.updateProfile({name}); editProfile=false; saveP(); toast("Perfil actualizado","user"); render(); }catch(err){ toast(errMsg(err),"info","err"); } }
const FORM_SEND = { subForm:()=>submitStep(), ideaForm:()=>submitIdea(), authForm:()=>submitAuth(), profForm:()=>saveProfileForm() };
document.addEventListener("submit", e=>{ e.preventDefault(); const f=FORM_SEND[e.target.id]; if(f) f(); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("#modalRoot").innerHTML){ closeModal(); return; }
  if(e.key==="Enter" && e.target.tagName==="INPUT" && e.target.form && FORM_SEND[e.target.form.id]){ e.preventDefault(); FORM_SEND[e.target.form.id](); return; }
  const card = e.target.closest && e.target.closest(".pcard");
  if(card && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); zoomIdx=0; go("proyecto", card.dataset.id); return; }
  if(!L || $("#lesson").hidden) return;
  if(e.key==="Enter" && (!["BUTTON","A","TEXTAREA"].includes(e.target.tagName))){ const b=$("#mainBtn"); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
  if(/^[1-4]$/.test(e.key) && L.state==="answer" && e.target.tagName!=="INPUT"){ const o=$$('#lesson [data-act="pick"]')[+e.key-1]; if(o) o.click(); }
});
/* Arrastrar fotos sobre el formulario en computadora */
document.addEventListener("dragover", e=>{ if(view==="publicar" && W && W.step===1) e.preventDefault(); });
document.addEventListener("drop", e=>{ if(view==="publicar" && W && W.step===1){ e.preventDefault(); handleFiles(e.dataTransfer.files); } });

/* ---------- Inicio ---------- */
(async function boot(){
  $("#fav").href=LOGO; $("#appleIcon").href=LOGO; $("#sideIcon").src=LOGO; $("#sideWord").src=WORD;
  const h=(location.hash||"").slice(1), m=h.match(/^proyecto-(.+)$/), mc=h.match(/^capitulo-([0-3])$/);
  if(mc){ view="capitulo"; param=mc[1]; }
  else if(h==="aprender"||h==="juegos"){ view="jugar"; playTab=h==="juegos"?"juegos":"ruta"; }
  else if(m){ view="proyecto"; param=m[1]; } else if(["inicio","jugar","proyectos","ligas","tienda","glosario","perfil","cuenta","acerca","admin"].includes(h)) view=h;
  /* Las cuentas reales necesitan la página publicada en internet (https). Abierta como archivo, usa el modo prueba. */
  const online = /^https?:$/.test(location.protocol);
  try { DB = FIREBASE_CONFIG && online ? await makeFirebaseDB() : makeLocalDB(); }
  catch(err){ console.error(err); toast("No se pudo conectar con el servidor. Usando modo prueba.","info","err"); DB = makeLocalDB(); }
  await DB.init(onUser);
  render();
  setInterval(()=>{ if(P && $("#lesson").hidden){ const b=P.battery; regen(); if(P.battery!==b){ saveP(); renderRail(); } } }, 60000);
})();
